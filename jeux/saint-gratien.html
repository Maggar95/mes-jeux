<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.pen{display:grid;gap:10px;margin-top:14px}
.pen-info{margin:0;font-weight:600;color:var(--muted)}
.pen-goal{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:4px;padding:8px;border:3px solid var(--fg);border-bottom-width:0;border-radius:6px 6px 0 0;background:var(--panel2)}
.pen-cell{border:2px dashed var(--line);border-radius:8px;background:transparent;color:var(--fg);cursor:pointer;position:relative;z-index:2;font:inherit}

.pen-head{display:block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#f1c9a5 40%,#d29a70);box-shadow:0 0 10px 2px rgba(255,255,255,.7)}
.pen-body{display:block;width:34px;height:26px;border-radius:6px 6px 3px 3px;background:#12a05a;margin-top:2px}
.pen-keeper.dive .pen-body{transform:rotate(-8deg)}
.pen-msg{margin:0;min-height:1.6em;font-weight:700}
.pen-msg.ok{color:var(--good)} .pen-msg.ko{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.pen-keeper{transition:none}}
.keypad{display:grid;gap:8px;margin:14px 0}
.keypad label{font-weight:600;color:var(--muted)}
.keypad input{font:inherit;font-size:28px;letter-spacing:.5em;text-align:center;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--fg);width:100%;box-sizing:border-box}
.keypad input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.keypad .kp-go:disabled{opacity:.5;cursor:default}
.jb-panel{display:grid;gap:12px;min-width:0;margin:12px 0;padding:14px;background:var(--panel);border:2px solid var(--line);border-radius:14px}
.jb-hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-weight:600}

.jb-bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.jb-bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
.jb-stage{position:relative;overflow:hidden;border-radius:12px;background:var(--region);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.jb-say{min-height:1.6em;font-weight:700;margin:0}
.jb-say.jb-ok{color:var(--good)} .jb-say.jb-ko{color:var(--bad)}
/* flyers */
.jb-street { height: 300px; }
.jb-lane { position: absolute; left: 0; right: 0; height: 33.33%; border-bottom: 2px dashed var(--ghost); }
.jb-pers { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); font-size: 30px; line-height: 1; display: grid; place-items: center; cursor: pointer; padding: 0; will-change: transform; }

/* boulangerie */
.jb-bake { padding: 14px; display: grid; gap: 14px; background: var(--panel2); }
.jb-belt { text-align: center; font-size: 76px; line-height: 1.1; min-height: 100px; display: grid; place-items: center; background: var(--region); border-radius: 12px; border: 2px dashed var(--ghost); }
.jb-bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.jb-bin { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; display: grid; gap: 2px; min-height: 84px; place-content: center; font-weight: 600; }
.jb-bin span { font-size: 30px; }
.jb-bin.jb-good { border-color: var(--good); background: color-mix(in srgb, var(--good) 20%, var(--panel)); }
.jb-bin.jb-bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 20%, var(--panel)); }

/* enfants */
.jb-salon { padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--panel2); }
.jb-spot { position: relative; height: 104px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--muted); padding: 0; cursor: pointer; }

.jb-mess u { text-decoration: none; width: 18px; height: 18px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); display: inline-block; }
.jb-mess u.jb-f { background: var(--bad); border-color: var(--bad); }

.jb-sing{height:300px}
.jb-zone{position:absolute;left:0;right:0;top:232px;height:40px;background:rgba(255,198,41,.22);border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);pointer-events:none}

.jb-col:last-child{border-right:0}
.jb-col .jb-ln{position:absolute;bottom:6px;left:0;right:0;font-weight:700;font-size:13px;color:var(--muted)}

.jb-col.jb-bd{background:color-mix(in srgb,var(--bad) 28%,transparent)}

<title>Direction Saint-Gratien</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Concept : panneau de gare de nuit. Un tableau d'horloge en haut, une ligne à trois arrêts, une carte de scène avec des choix en boutons larges. */
:root {
  color-scheme: dark;
  --bg: #0d1530;
  --panel: #162250;
  --panel2: #1e2d63;
  --fg: #f1f4fc;
  --muted: #a3aed6;
  --line: #2e3d77;
  --accent: #ffc629;
  --accent-fg: #1b1400;
  --accent-ink: #ffc629;
  --good: #46d39a;
  --bad: #ff7a7a;
  --focus: #7fb2ff;
  --secret: #b88cff; --secret-soft: #2c2158; --region: #1a2859; --ghost: #3b4a85;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #edf0f8; --panel: #ffffff; --panel2: #f1f4fb; --fg: #101a3b; --muted: #56618a;
    --line: #cfd6ea; --accent-ink: #8a5b00; --good: #0c7a53; --bad: #b83232; --focus: #1b5fd6;
    --secret: #7b3fc4; --secret-soft: #ece2fb; --region: #e4e9f6; --ghost: #b9c2dc;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf0f8; --panel: #ffffff; --panel2: #f1f4fb; --fg: #101a3b; --muted: #56618a;
  --line: #cfd6ea; --accent-ink: #8a5b00; --good: #0c7a53; --bad: #b83232; --focus: #1b5fd6;
  --secret: #7b3fc4; --secret-soft: #ece2fb; --region: #e4e9f6; --ghost: #b9c2dc;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.02; }
h1 { font-size: clamp(44px, 12vw, 68px); text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: clamp(30px, 8vw, 40px); }
.lead { color: var(--muted); margin: 0; max-width: 60ch; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: 15px; font-weight: 600; color: var(--accent-ink); }
button { font: inherit; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }


/* Mini-jeux d'Eva */
.mg { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; padding: 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; }
.mg-title { font-family: var(--font-display); font-size: 28px; margin: 2px 0 4px; line-height: 1.05; }
.mg-pegs { display: flex; gap: 8px; }
.mg-peg { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); padding: 0; display: inline-block; cursor: pointer; }
.mg-peg.sm { width: 28px; height: 28px; cursor: default; }
.mg-peg.c0 { background: #e0483e; } .mg-peg.c1 { background: #3b82d6; } .mg-peg.c2 { background: #2fa36b; } .mg-peg.c3 { background: #e0b02f; } .mg-peg.c4 { background: #9b5fd0; }
.mg-peg:disabled { opacity: .45; cursor: default; }
.mg-hist { display: flex; flex-direction: column; gap: 6px; }
.mg-line { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; }
.mg-track { position: relative; height: 56px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.mg-zone { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .85; }
.mg-mark { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: var(--accent); border-radius: 3px; }
.mg canvas { width: 100%; max-width: 100%; height: auto; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); touch-action: manipulation; }
.mg-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mg-cards button { aspect-ratio: 1; font-size: 30px; padding: 0; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; min-height: 56px; }
.mg-cards button.up, .mg-cards button.done { background: var(--panel2); } .mg-cards button.done { border-color: var(--good); }
.mg-die { font-family: var(--font-display); font-size: 96px; font-weight: 700; text-align: center; line-height: 1; padding: 8px 0; }
.mg-big { min-height: 64px; font-size: 20px; }


/* Carte */
.mapbar { display: flex; }
.mapbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; min-height: 44px; font-weight: 600; cursor: pointer; }
.mapbtn:hover { border-color: var(--accent); }
.mapbtn svg { width: 20px; height: 20px; color: var(--accent-ink); }
.mapcount { font-weight: 500; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mapdot { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--secret); border: 2px solid var(--bg); }
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(5,8,22,.66); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.panel { width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; background: var(--bg); border-radius: 18px 18px 0 0; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.ph { display: flex; align-items: center; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.ph h2 { flex: 1; font-size: 28px; }
.close { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 14px; cursor: pointer; }
.pb { overflow: auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.stats b { font-family: var(--font-display); font-size: 30px; color: var(--accent-ink); }
.mapbar2 { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; } .mapbar2 i { display: block; height: 100%; background: var(--accent); }
svg.map { flex: none; width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.reg { fill: var(--region); stroke: var(--line); } .sub { fill: none; stroke: var(--ghost); stroke-dasharray: 5 4; }
.regl { font: 600 10px var(--font-display); letter-spacing: .1em; fill: var(--muted); text-transform: uppercase; }
.edge { stroke: var(--ghost); stroke-width: 2; stroke-dasharray: 4 4; fill: none; } .edge.on { stroke: var(--accent-ink); stroke-dasharray: none; stroke-width: 3; } .edge.sewer { stroke: var(--secret); }
.node { cursor: pointer; } .node circle.b { fill: var(--panel); stroke: var(--ghost); stroke-width: 2.5; stroke-dasharray: 3 3; }
.node.seen circle.b { fill: var(--accent); stroke: var(--accent-ink); stroke-dasharray: none; }
.node.sec circle.b { fill: var(--secret-soft); stroke: var(--secret); stroke-dasharray: none; stroke-width: 3; }
.node circle.h { display: none; fill: none; stroke: var(--good); stroke-width: 3; } .node.here circle.h { display: block; }
.node text.q { font: 700 15px var(--font-display); fill: var(--muted); text-anchor: middle; }
.node text.n { font: 600 10.5px var(--font-body); fill: var(--fg); text-anchor: middle; }
.node.seen text.q { fill: var(--accent-fg); } .node.sec text.q { fill: var(--secret); }
.node:focus-visible circle.b { stroke: var(--focus); stroke-width: 4; }
.mapinfo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 74px; }
.mapname { font-family: var(--font-display); font-size: 22px; } .maptag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--secret-soft); color: var(--secret); margin-left: 6px; }

/* Départ */
.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.who-btn {
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 10px; cursor: pointer; text-align: center; min-height: 46px;
}
.who-btn:hover { border-color: var(--accent); }
.who-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 14px 18px;
  font-weight: 600; cursor: pointer; min-height: 50px;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 180px; }
.small { font-size: 14px; color: var(--muted); margin: 0; }

/* Tableau de bord */
.board {
  display: grid; grid-template-columns: auto 1fr 1.4fr; gap: 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
.clock { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1; color: var(--accent-ink); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.clock small { display: block; margin-top: 5px; font: 500 12px/1.2 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat .k { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 480px) { .board { grid-template-columns: auto 1fr; } .bagbox { grid-column: 1 / -1; } }
.line { display: flex; list-style: none; margin: 0; padding: 0 0 2px; position: relative; }
.line::before { content: ""; position: absolute; left: 16%; right: 16%; top: 8px; height: 3px; background: var(--line); }
.line li { position: relative; flex: 1; text-align: center; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.line li::before { content: ""; display: block; width: 17px; height: 17px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line); margin: 0 auto 6px; position: relative; }
.line li[aria-current="step"] { color: var(--fg); font-weight: 600; }
.line li[aria-current="step"]::before { background: var(--accent); border-color: var(--accent); }

.need { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.need li { font-size: 13px; border: 1px dashed var(--line); border-radius: 999px; padding: 3px 11px; color: var(--muted); }
.need li.ok { border-style: solid; border-color: var(--good); color: var(--good); }

/* Scène */
.scene, .endcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.place { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; font-size: 16px; font-weight: 600; color: var(--accent-ink); }
.with { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 8px; }
.note { margin: 0; font-style: italic; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.txt p { margin: 0 0 .8em; max-width: 64ch; }
.txt p:last-child { margin-bottom: 0; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.choice {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  text-align: left; color: var(--fg); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 50px;
}
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice[disabled] { opacity: .6; cursor: not-allowed; }
.choice .lab { min-width: 0; overflow-wrap: anywhere; }
.cost { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.timer { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: shrink linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* Fins */
.badge { align-self: flex-start; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; border-radius: 999px; padding: 4px 10px; border: 1px solid currentColor; }
.badge.win { color: var(--good); } .badge.lose { color: var(--bad); } .badge.hidden { color: var(--accent-ink); }
.sum { font-size: 14px; color: var(--muted); margin: 0; }
.found { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.score { font: 700 clamp(34px,10vw,48px)/1 var(--font-display); color: var(--accent-ink); margin: 0; font-variant-numeric: tabular-nums; }
.pseudo { display: grid; gap: 6px; }
.pseudo label { font-size: 14px; color: var(--muted); }

.lb { width: 100%; border-collapse: collapse; font-size: 15px; }

<script>
/*DATA_START*/
const END_T = 240;
/* ---------- Mini-jeux d'Eva (tirés au hasard) ---------- */
const JOB = (function(){
  const rr = (a, b) => a + Math.random() * (b - a);
  const choose = a => a[Math.floor(Math.random() * a.length)];
  const K = s => s.split(' ').map(k => 'jb-' + k).join(' ');
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = K(c); if (x != null) e.textContent = x; return e; };
  let stopFn = null, dead = false;
  function stop(){ dead = true; if (stopFn){ stopFn(); stopFn = null; } }
/* ---------------- 1. Flyers ---------------- */
  function runFlyers(box, done) {
    const DUR = 30, STOCK = 20;
    let stock = STOCK, given = 0, wasted = 0, t0 = performance.now(), alive = true, raf = 0, nextSpawn = 0.4;
    const hud = el('div', 'hud'); const sT = el('span'), sS = el('span'), sG = el('span'); hud.append(sT, sS, sG);
    const bar = el('div', 'bar'); const bi = el('i'); bar.append(bi);
    const stage = el('div', 'stage street'); stage.setAttribute('aria-label', 'Le trottoir');
    for (let i = 0; i < 3; i++) { const l = el('div', 'lane'); l.style.top = (i * 33.33) + '%'; stage.append(l); }
    const say = el('p', 'say'); say.setAttribute('aria-live', 'polite');
    box.append(hud, bar, stage, say);
    const people = [];
    const FACES = ['🚶', '🚶‍♀️', '🧍', '🧍‍♀️', '🏃'];
    function paint(rem) {
      sT.textContent = '⏱ ' + Math.ceil(rem) + ' s';
      sS.textContent = '📄 Flyers : ' + stock;
      sG.textContent = '✔ Donnés : ' + given;
      bi.style.transform = 'scaleX(' + Math.max(0, rem / DUR) + ')';
    }
    function pop(x, y, txt, cls) { const p = el('div', 'pop ' + cls, txt); p.style.left = Math.max(4, x - 20) + 'px'; p.style.top = y + 'px'; stage.append(p); setTimeout(() => p.remove(), 800); }
    function spawn() {
      const W = stage.clientWidth, H = stage.clientHeight;
      const lane = Math.floor(Math.random() * 3), dir = Math.random() < 0.5 ? 1 : -1;
      const busy = Math.random() < 0.3;
      const b = el('button', 'pers' + (busy ? ' busy' : ''), busy ? '📱' : choose(FACES)); b.type = 'button';
      b.setAttribute('aria-label', busy ? 'Passant sur son téléphone' : 'Passant');
      const speed = rr(70, 140) * dir; const y = lane * (H / 3) + (H / 6) - 28;
      const o = { b, x: dir > 0 ? -60 : W + 4, y, speed, busy, gone: false };
      b.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px)';
      b.addEventListener('click', () => {
        if (!alive || o.gone || stock <= 0) return;
        stock--; o.gone = true;
        const r = b.getBoundingClientRect(), s = stage.getBoundingClientRect();
        if (o.busy) { wasted++; pop(r.left - s.left, r.top - s.top - 6, '« Non merci. »', 'ko'); say.textContent = 'Il ne lève même pas les yeux : flyer perdu.'; say.className = K('say ko'); }
        else { given++; pop(r.left - s.left, r.top - s.top - 6, '« Merci ! »', 'ok'); say.textContent = ''; say.className = K('say'); }
        b.remove(); paint(DUR - (performance.now() - t0) / 1000);
        if (stock <= 0) end();
      });
      stage.append(b); people.push(o);
    }
    let last = performance.now();
    function tick(now) {
      if (!alive) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const el_ = (now - t0) / 1000, rem = DUR - el_;
      if (rem <= 0) { paint(0); end(); return; }
      nextSpawn -= dt; if (nextSpawn <= 0) { spawn(); nextSpawn = rr(0.45, 0.95); }
      const W = stage.clientWidth;
      for (let i = people.length - 1; i >= 0; i--) {
        const o = people[i];
        if (o.gone) { people.splice(i, 1); continue; }
        o.x += o.speed * dt; o.b.style.transform = 'translate(' + o.x + 'px,' + o.y + 'px)';
        if (o.x < -80 || o.x > W + 20) { o.b.remove(); people.splice(i, 1); }
      }
      paint(rem); raf = requestAnimationFrame(tick);
    }
    function end() {
      if (!alive) return; alive = false; cancelAnimationFrame(raf);
      let pay = 0, title, text;
      if (given >= 10) { pay = 10; title = 'Le patron est content'; text = 'Presque tout le trottoir a un flyer en main. Le patron te donne 10 € en bougonnant, ce qui est sa façon de dire merci.'; }
      else if (given >= 5) { pay = 5; title = 'Un petit billet'; text = 'Pas mal, mais le patron voit encore des flyers dans ton sac. Il te donne 5 €.'; }
      else { pay = 0; title = 'Des flyers sur le trottoir'; text = 'La moitié finit par terre. Le patron te regarde, regarde les flyers, et ne sort pas son portefeuille.'; }
      setTimeout(() => done({ title, text, pay, detail: given + ' flyers donnés, ' + wasted + ' gâchés' }), 250);
    }
    paint(DUR); raf = requestAnimationFrame(tick);
    return () => { alive = false; cancelAnimationFrame(raf); };
  }

  /* ---------------- 2. Boulangerie ---------------- */
  function runBoulange(box, done) {
    const DUR = 30;
    const ITEMS = [
      ['🥖', 'b'], ['🥖', 'b'], ['🥐', 'v'], ['🥐', 'v'], ['🥞', 'v'], ['🍞', 'p'], ['🥨', 'p'], ['🥯', 'p'], ['🍞', 'p']
    ];
    const BINS = [['b', '🥖', 'Baguettes'], ['v', '🥐', 'Viennoiseries'], ['p', '🍞', 'Pains']];
    let ok = 0, ko = 0, cur = null, alive = true, t0 = performance.now(), iv = 0, lock = false;
    const hud = el('div', 'hud'); const sT = el('span'), sO = el('span'); hud.append(sT, sO);
    const bar = el('div', 'bar'); const bi = el('i'); bar.append(bi);
    const area = el('div', 'stage bake');
    const belt = el('div', 'belt'); belt.setAttribute('aria-live', 'polite');
    const bins = el('div', 'bins'); const btns = {};
    BINS.forEach(([k, ico, name]) => {
      const b = el('button', 'bin'); b.type = 'button'; b.append(el('span', null, ico), el('b', null, name));
      b.addEventListener('click', () => answer(k, b)); bins.append(b); btns[k] = b;
    });
    area.append(belt, bins);
    box.append(hud, bar, area);
    function next() { cur = choose(ITEMS); belt.textContent = cur[0]; belt.setAttribute('aria-label', 'Produit : ' + cur[0]); lock = false; }
    function paint() {
      const rem = DUR - (performance.now() - t0) / 1000;
      sT.textContent = '⏱ ' + Math.max(0, Math.ceil(rem)) + ' s'; sO.textContent = '✔ ' + ok + '   ✖ ' + ko;
      bi.style.transform = 'scaleX(' + Math.max(0, rem / DUR) + ')'; return rem;
    }
    function answer(k, b) {
      if (!alive || lock) return; lock = true;
      const good = cur[1] === k;
      if (good) ok++; else ko++;
      b.classList.add(good ? 'jb-good' : 'jb-bad'); if (!good) btns[cur[1]].classList.add('jb-good');
      paint();
      setTimeout(() => { Object.values(btns).forEach(x => x.classList.remove('jb-good', 'jb-bad')); if (alive) next(); }, good ? 140 : 450);
    }
    iv = setInterval(() => { if (paint() <= 0) end(); }, 200);
    function end() {
      if (!alive) return; alive = false; clearInterval(iv);
      const net = ok - ko; let pay = 0, title, text;
      if (net >= 12) { pay = 8; title = 'Rangé en un temps record'; text = 'La boulangère te met 8 € dans la poche, plus un pain au chocolat qu’elle jure ne pas avoir vu.'; }
      else if (net >= 7) { pay = 4; title = 'Presque tout est à sa place'; text = 'Quelques baguettes chez les croissants, mais elle te glisse 4 € et un sourire fatigué.'; }
      else { pay = 0; title = 'Les croissants sont avec les baguettes'; text = 'La boulangère refait tout le rangement derrière toi, sans un mot. Pas de pièce, pas de pain au chocolat.'; }
      done({ title, text, pay, detail: ok + ' bien rangés, ' + ko + ' erreurs' });
    }
    next(); paint();
    return () => { alive = false; clearInterval(iv); };
  }

  /* ---------------- 3. Enfants ---------------- */
  function runKids(box, done) {
    const DUR = 30, MAXMESS = 6, LIFE = 2300;
    const SPOTS = ['Canapé', 'Étagère', 'Tapis', 'Table', 'Rideaux', 'Placard'];
    const DEEDS = [['🖍️', 'Crayon sur le mur'], ['🎨', 'Pot de peinture'], ['🐹', 'Hamster en liberté'], ['🔧', 'Tournevis'], ['🍯', 'Pot de miel'], ['✂️', 'Ciseaux']];
    let mess = 0, stopped = 0, alive = true, t0 = performance.now(), raf = 0, nextAt = 0.5;
    const hud = el('div', 'hud'); const sT = el('span'), sS = el('span'); const sM = el('span', 'mess'); sM.setAttribute('aria-label', 'Dégâts'); hud.append(sT, sS, sM);
    const dots = []; for (let i = 0; i < MAXMESS; i++) { const u = el('u'); dots.push(u); sM.append(u); }
    const bar = el('div', 'bar'); const bi = el('i'); bar.append(bi);
    const salon = el('div', 'stage salon');
    const say = el('p', 'say'); say.setAttribute('aria-live', 'polite');
    const spots = SPOTS.map(n => {
      const b = el('button', 'spot'); b.type = 'button';
      const ico = el('span', 'ico', '🧒'); const nm = el('span', 'nm', n);
      const life = el('i'); const lb = el('b'); life.append(lb); life.hidden = true;
      b.append(life, ico, nm); salon.append(b);
      const s = { b, ico, life, lb, deed: null, born: 0 };
      b.addEventListener('click', () => {
        if (!alive || !s.deed) return;
        stopped++; say.textContent = 'Stoppé : ' + s.deed[1].toLowerCase() + '.'; say.className = K('say ok'); clear(s); paintHud();
      });
      return s;
    });
    box.append(hud, bar, salon, say);
    function clear(s) { s.deed = null; s.b.classList.remove('jb-on'); s.ico.textContent = '🧒'; s.life.hidden = true; }
    function paintHud() {
      const rem = DUR - (performance.now() - t0) / 1000;
      sT.textContent = '⏱ ' + Math.max(0, Math.ceil(rem)) + ' s'; sS.textContent = '✋ ' + stopped;
      dots.forEach((u, i) => u.classList.toggle('jb-f', i < mess));
      bi.style.transform = 'scaleX(' + Math.max(0, rem / DUR) + ')'; return rem;
    }
    let last = performance.now();
    function tick(now) {
      if (!alive) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const rem = paintHud();
      if (rem <= 0 || mess >= MAXMESS) { end(); return; }
      nextAt -= dt;
      const prog = 1 - rem / DUR;
      if (nextAt <= 0) {
        const free = spots.filter(s => !s.deed);
        if (free.length) { const s = choose(free); s.deed = choose(DEEDS); s.born = now; s.b.classList.add('jb-on'); s.ico.textContent = s.deed[0]; s.life.hidden = false; }
        nextAt = rr(0.55, 1.0) - prog * 0.25;
      }
      spots.forEach(s => {
        if (!s.deed) return;
        const k = (now - s.born) / LIFE;
        s.lb.style.transform = 'scaleX(' + Math.max(0, 1 - k) + ')';
        if (k >= 1) { mess++; say.textContent = s.deed[1] + ' : trop tard, les dégâts s’accumulent.'; say.className = K('say ko'); clear(s); }
      });
      raf = requestAnimationFrame(tick);
    }
    function end() {
      if (!alive) return; alive = false; cancelAnimationFrame(raf); paintHud();
      let pay = 0, title, text;
      if (mess >= MAXMESS) { title = 'Le hamster a gagné'; text = 'Les parents rentrent sur un tableau de Jackson Pollock avec un hamster dessus. Ils ne te payent pas et ne te dénoncent pas non plus.'; }
      else if (mess <= 2) { pay = 15; title = 'Les enfants veulent te garder'; text = 'Presque aucune bêtise. Les parents rentrent, ravis, et te tendent 15 € en disant que c’est pour « la tranquillité ».'; }
      else if (mess <= 4) { pay = 7; title = 'Quelques taches de peinture'; text = 'Un mur à ravoir, mais les enfants sont couchés. Les parents te donnent 7 € et t’évitent du regard.'; }
      else { title = 'Une soirée mouvementée'; text = 'Les parents tombent sur un pot de miel dans le canapé. Pas de paiement, mais pas de reproche non plus.'; }
      setTimeout(() => done({ title, text, pay, detail: stopped + ' bêtises stoppées, ' + mess + ' dégâts' }), 300);
    }
    paintHud(); raf = requestAnimationFrame(tick);
    return () => { alive = false; cancelAnimationFrame(raf); };
  }


  /* ---------------- 4. Chant ---------------- */
  function runChant(box, done){
    const N = 24, FALL = 2.1, WIN = 0.24, LANES = 4, ZONE = 250;
    const notes = []; let tt = 1.4;
    for (let i = 0; i < N; i++){ notes.push({ t: tt, lane: Math.floor(Math.random() * LANES), el: null, st: 0 }); tt += rr(0.85, 1.25); }
    const END_T = tt + 0.4;
    let hits = 0, wrong = 0, miss = 0, combo = 0, best = 0, alive = true, raf = 0, t0 = performance.now();
    const hud = el('div', 'hud'); const sH = el('span'), sC = el('span'), sM = el('span'); hud.append(sH, sC, sM);
    const stage = el('div', 'stage sing'); stage.setAttribute('aria-label', 'Les notes à chanter : une colonne par touche');
    const zone = el('div', 'zone'); stage.append(zone);
    const cols = el('div', 'cols'); stage.append(cols);
    const KEYS = ['d', 'f', 'j', 'k'], NAMES = ['Do', 'Mi', 'Sol', 'Si aigu'];
    const btns = [];
    for (let i = 0; i < LANES; i++){
      const b = el('button', 'col'); b.type = 'button'; b.setAttribute('aria-label', 'Chanter ' + NAMES[i] + ' (touche ' + KEYS[i].toUpperCase() + ')');
      b.append(el('span', 'ln', NAMES[i]));
      b.addEventListener('pointerdown', e => { e.preventDefault(); tap(i); });
      cols.append(b); btns.push(b);
    }
    const say = el('p', 'say'); say.setAttribute('aria-live', 'polite');
    box.append(hud, stage, say);
    const speed = (ZONE + 40) / FALL;
    function now(){ return (performance.now() - t0) / 1000; }
    function paint(){ sH.textContent = '🎵 ' + hits + ' / ' + N; sC.textContent = 'Enchaînement : ' + combo; sM.textContent = '✖ ' + (miss + wrong); }
    function flash(i, cls){ btns[i].classList.add(cls); setTimeout(() => btns[i].classList.remove(cls), 160); }
    function tap(i){
      if (!alive) return; const n = now();
      let c = null, cd = 9;
      notes.forEach(o => { if (o.lane === i && o.st === 0) { const d = Math.abs(o.t - n); if (d <= WIN && d < cd) { c = o; cd = d; } } });
      if (c){
        c.st = 1; hits++; combo++; best = Math.max(best, combo);
        if (c.el) { c.el.classList.add('jb-won'); const e = c.el; setTimeout(() => e.remove(), 220); }
        say.textContent = cd < 0.1 ? 'Parfait !' : 'Bien !'; say.className = K('say ok'); flash(i, 'jb-gd');
      } else {
        wrong++; combo = 0; say.textContent = 'À côté, le pigeon grimace.'; say.className = K('say ko'); flash(i, 'jb-bd');
      }
      paint();
    }
    function onKey(e){ const i = KEYS.indexOf(e.key.toLowerCase()); if (i >= 0 && !e.repeat) tap(i); }
    document.addEventListener('keydown', onKey);
    function tick(){
      if (!alive) return; const n = now();
      notes.forEach(o => {
        if (o.st === 2 || o.st === 1) return;
        if (!o.el && n >= o.t - FALL) {
          o.el = el('div', 'note', '🎵'); o.el.style.left = (o.lane * 25 + 12.5) + '%'; stage.append(o.el);
        }
        if (o.el) o.el.style.transform = 'translate(-50%,' + (ZONE - (o.t - n) * speed - 20) + 'px)';
        if (n > o.t + WIN) { o.st = 2; miss++; combo = 0; if (o.el) { o.el.classList.add('jb-lost'); const e = o.el; setTimeout(() => e.remove(), 300); } paint(); }
      });
      if (n >= END_T) { end(); return; }
      raf = requestAnimationFrame(tick);
    }
    function end(){
      if (!alive) return; alive = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey);
      const net = hits - wrong * 0.5; let pay, title, text;
      if (net >= N * 0.65) { pay = 12; title = 'Standing ovation'; text = 'Tu entonnes « All I Want for Christmas Is You ». Un homme s’arrête, applaudit, et laisse un billet. Puis une dame, puis un groupe de fêtards qui fait chœur. Tu récoltes 12 €, une standing ovation et une extinction de voix.'; }
      else if (net >= N * 0.35) { pay = 5; title = 'Le refrain sauve la mise'; text = 'Quelques notes tombent à côté, mais le refrain passe. Une dame laisse une pièce, deux fêtards te lancent un billet de 5 € « pour que tu continues, ou que tu t’arrêtes, on ne sait pas ».'; }
      else { pay = 1; title = 'Le pigeon applaudit à moitié'; text = 'Tu chantes devant la gare. Un pigeon te regarde, un contrôleur te regarde, et une dame traverse la rue pour ne pas t’entendre. Tu récoltes 1 €, que tu soupçonnes d’être une erreur.'; }
      setTimeout(() => done({ title, text, pay, detail: hits + ' notes justes sur ' + N + ', meilleur enchaînement : ' + best }), 300);
    }
    paint(); raf = requestAnimationFrame(tick);
    return () => { alive = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); };
  }

  const GAMES = { fly: runFlyers, boul: runBoulange, kids: runKids, chant: runChant };
  function run(kind, area, cb){
    stop(); dead = false; area.textContent = '';
    const box = el('div', 'panel'); area.appendChild(box);
    stopFn = GAMES[kind](box, r => { if (!dead){ stopFn = null; cb(r); } });
  }
  return { run, stop };
})();
const PEN = (function(){
  let tok = 0, tm = null;
  function stop(){ tok++; if (tm){ clearTimeout(tm); tm = null; } }
  function run(area, done){
    stop(); const my = tok;
    const N = 5, NEED = 3; let shot = 0, goals = 0, last = -1, busy = false;
    area.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'pen';
    const info = document.createElement('p'); info.className = 'pen-info';
    const goal = document.createElement('div'); goal.className = 'pen-goal';
    const keeper = document.createElement('div'); keeper.className = 'pen-keeper'; keeper.setAttribute('aria-hidden','true');
    keeper.innerHTML = '<i class="pen-head"></i><i class="pen-body"></i>';
    goal.appendChild(keeper);
    const msg = document.createElement('p'); msg.className = 'pen-msg'; msg.setAttribute('aria-live','polite');
    const cells = [];
    const NAMESROW = ['en haut','en bas'], NAMESCOL = ['à gauche','au centre','à droite'];
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++){
      const b = document.createElement('button'); b.type = 'button'; b.className = 'pen-cell';
      b.setAttribute('aria-label', 'Tirer ' + NAMESROW[r] + ' ' + NAMESCOL[c]);
      b.addEventListener('click', () => shoot(r, c));
      goal.appendChild(b); cells.push(b);
    }
    wrap.append(info, goal, msg); area.appendChild(wrap);
    function paint(){ info.textContent = 'Tir ' + Math.min(shot + 1, N) + ' sur ' + N + ' · buts : ' + goals + ' (il en faut ' + NEED + ')'; }
    paint();
    function shoot(r, c){
      if (busy || my !== tok) return; busy = true;
      cells.forEach(b => b.disabled = true);
      let kc = Math.floor(Math.random() * 3);
      if (c === last && Math.random() < 0.5) kc = c;
      last = c;
      keeper.style.left = (kc * 33.33 + 16.66) + '%';
      keeper.classList.add('dive');
      let text, ok = false;

    const p = t => { const e = document.createElement('p'); e.className = 'small'; e.style.margin = '0'; e.textContent = t; return e; };
    if (!z) { el.append(p('Touche un lieu pour voir ce qu\u2019on y a vécu. Les ronds en pointillés sont des lieux encore inconnus.')); return; }
    if (!seen[z.id]) { el.append(p('Lieu pas encore découvert. Continue d\u2019explorer.')); return; }
    const b = document.createElement('b'); b.className = 'mapname'; b.textContent = nm(z); el.append(b);
    if (z.sec) { const t = document.createElement('span'); t.className = 'maptag'; t.textContent = 'Lieu secret'; b.after(t); }
    el.append(p(z.tip + (here === z.id ? ' Tu es ici.' : '')));
  }
  function open(){
    load(); fresh = false; selected = here; count(); const [n, s] = count();
    document.getElementById('mapcnt').textContent = n + ' / ' + normals.length;
    document.getElementById('mapcnt2').textContent = 'lieux découverts' + (s ? ' · ' + s + ' secret' + (s > 1 ? 's' : '') + ' trouvé' + (s > 1 ? 's' : '') : ' · des lieux secrets existent…');
    document.getElementById('mappct').style.width = Math.round(n / normals.length * 100) + '%';
    renderMap(); renderInfo(); document.getElementById('sheet').hidden = false; document.getElementById('mapclose').focus();
  }
  function close(){ document.getElementById('sheet').hidden = true; const b = document.getElementById('mapbtn'); if (b) b.focus(); }
  function reset(){ here = null; fresh = false; selected = null; loadedFor = null; load(); count(); }
  function init(){
    const b = document.getElementById('mapbtn'); if (b) b.addEventListener('click', open);
    const c = document.getElementById('mapclose'); if (c) c.addEventListener('click', close);
    const c2 = document.getElementById('mapclose2'); if (c2) c2.addEventListener('click', close);
    const sh = document.getElementById('sheet'); if (sh) sh.addEventListener('click', e => { if (e.target === sh) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && sh && !sh.hidden) close(); });
  }
  return { visit, init, reset, count };
})();

function pad(n){ return String(n).padStart(2,'0'); }
function clockParts(t){ const n = 20*60+t; return [Math.floor(n/60)%24, n%60]; }
function fmt(t){ const p = clockParts(t); return p[0]+'h'+pad(p[1]); }
function fmtc(t){ const p = clockParts(t); return pad(p[0])+':'+pad(p[1]); }
function leftTxt(t){ const r = END_T - t; if (r <= 0) return 'minuit passé'; const h = Math.floor(r/60), m = r%60; return h ? h+' h '+pad(m) : m+' min'; }
function eur(n){ n = Math.round(n*100)/100; return (Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.',','))+' €'; }
function Y(S){ return S.player === 'yann' ? 'Maël' : 'Yann'; }
const pay = n => S => S.m + 0.001 < n ? "Pas assez d'argent" : null;
const B = (l,to,o) => Object.assign({l:l,to:to}, o || {});
const rnd = p => Math.random() < p;
const buy = (key,n) => S => (S.stock && S.stock[key] === false) ? 'En rupture' : pay(n)(S);

function newStock(){ const o = {}; Object.keys(AVAIL).forEach(k=>{ o[k] = rnd(AVAIL[k]); }); return o; }

 eva_salon: {p:"Le before · Cormeilles",
  text:"Dans le salon, il reste quelques amis qui rient, un plateau de tapas à moitié vide et une enceinte qui crache de la musique. On te glisse des tuyaux sans que tu demandes : « Alexandra est rentrée du Portugal avec des sacs. » « JC et Gabie parlent d'une doro party, mais personne ne sait où. » « Audrey cache un crémant que Quentin ne doit pas trouver. » « Virgile vend sa Mazda, Katia veut qu'il s'en sépare. » « Moizlard a une voiture énorme et une cheville foulée. »",

  text:S=>"Tu t'es dit « je me repose cinq minutes », et tu l'as dit toute la soirée. À minuit, tu es toujours dans le salon "+(S.player==='eva'?"de chez toi":"d'Eva")+", un verre à la main, au milieu des boîtes de jeux ouvertes. Dehors, Saint-Gratien compte à rebours sans toi. Ici, on compte aussi, plus fort et plus faux, devant une partie que personne n'a finie.\n\nTon téléphone vibre : Yann. « T'es où ? » Tu réponds : « Chez Eva. » Il répond : « Évidemment. » Il y a pire comme façon de passer le 31."},

   B("Frapper à la vitre", S=>S.pass?'boulangerie_ouvre':'boulangerie_non', {t:5, need:S=>S.t>=120, fx:S=>{ S.pass = rnd(0.45); }}),
   B("Ressortir", 'rue', {t:5})
  ]},
 boulanger_conseil: {p:"La boulangerie du coin",
  text:"« Pour un copain chirurgien ? Quelque chose de fait maison. Les gens sont toujours plus touchés qu'on s'imagine. Et pas de gâteau trop sucré, ils gardent un estomac fragile après les gardes. »",
  c:[B("Acheter une mini-bûche (6 €)", 'rue', {t:5, m:-6, item:'buche', lock:pay(6)}), B("Ressortir", 'rue', {t:5})]},
 boulangerie_ouvre: {p:"La boulangerie du coin",
  text:"La boulangère ouvre en soupirant. « Cinq minutes. Pas plus. Et ne dites à personne que j'ai fait ça. »",
  c:[B("Acheter une mini-bûche (6 €)", 'rue', {t:5, m:-6, item:'buche', lock:pay(6)})]},
 boulangerie_non: {p:"La boulangerie du coin",
  text:"La boulangère te fait signe, derrière la vitre, que non. Elle mime « bonne année » avec les mains. Tu es resté devant la vitrine un peu trop longtemps.",
  c:[B("Repartir", 'rue', {t:5})]},

 /* ---------- Part de Folie ---------- */
 partdefolie: {p:"Part de Folie · Cormeilles",
  text:"Le restaurant est plein, un serveur te hèle : « Table pour combien ? Ah non, Alexandra vous cherche. » Au fond, une tente roulée en boule trône sur une chaise, à côté de trois sacs.",
  c:[
   B("Aller voir Alexandra", 'alex', {t:5}),
   B("Les pizzas à volonté", 'pdf_pizzas', {t:10}),
   B("Commander un dessert à emporter (8 €)", 'rue', {t:10, m:-8, item:'gateau_pdf', lock:pay(8)}),
   B("Ressortir", 'rue', {t:5})
  ]},
 pdf_pizzas: {p:"Part de Folie · pizzas à volonté",
  text:"Une pancarte sur le comptoir : « Pizzas à volonté, 31 décembre ». Le pizzaïolo enfourne sans s'arrêter. Au menu : reine, chèvre-miel, quatre fromages, et, en dernier, écrit à la craie : « pizza aux carottes râpées ».",
  c:[
   B("Une reine, classique", 'pdf_pizzas', {t:15, note:"Correcte, chaude, parfaitement honnête."}),
   B("Une chèvre-miel", 'pdf_pizzas', {t:15, note:"Tu as une pensée pour l'épicier."}),
   B("La pizza aux carottes râpées", 'fin_carottes', {t:15}),
   B("Retourner dans le restaurant", 'partdefolie', {t:5})
  ]},
 fin_carottes: {end:'lose', h:"Pizza aux carottes râpées",
  text:"Tu mords dans la pizza aux carottes râpées. Une chaleur étrange te monte au visage, puis tu comprends : les carottes, tiédies sur la pâte, ont le goût de l'erreur. Tu fais un pas, deux pas, et tu tombes devant le comptoir. Le pizzaïolo se penche sur toi : « Ah. Encore un. » Sur ta pierre tombale, il sera écrit : « Il a pris la pizza aux carottes. » Yann ne le saura jamais."},
 alex: {p:"Part de Folie · Cormeilles", who:'alexandra',
  text:"Alexandra est à genoux sur la banquette, les bras plongés jusqu'aux épaules dans un sac. « Ah, tu tombes bien ! Tu n'as pas vu mes clés ? Ni mon téléphone ? Je suis rentrée du Portugal avant-hier, je suis encore dans un autre fuseau. » Elle déplie une carte de festivals sur la table, avec des flèches au feutre. « Cet été, on fait tout. Tout ! J'ai déjà la tente. » Elle pointe la boule sur la chaise.",
  c:[
   B("L'aider à retrouver ses clés", 'alex_cles', {t:5, fx:S=>{ S.kb = 1+Math.floor(Math.random()*3); S.tries = 0; }}),
   B("Écouter son plan de festival", 'alex_festival', {t:15}),
   B("Retourner au restaurant", 'partdefolie', {t:5})
  ]},
 alex_cles: {p:"Part de Folie · les sacs d'Alexandra", who:'alexandra',
  text:"Trois sacs : le vert, le bleu rayé, et celui qui a l'air d'avoir fait le Portugal à pied. Alexandra : « Elles sont forcément dans un des trois, sauf si elles sont dans ma veste. »",
  c:[
   B("Fouiller le sac vert", S=>S.kb===1?'alex_trouve':'alex_cles', {t:5, fx:S=>{ S.tries++; if (S.tries >= 2) S.kb = 99; }, note:"Des chaussettes dépareillées, trois flyers de festival, un harmonica."}),
   B("Fouiller le sac bleu rayé", S=>S.kb===2?'alex_trouve':'alex_cles', {t:5, fx:S=>{ S.tries++; if (S.tries >= 2) S.kb = 99; }, note:"Un bonnet, une carte du Portugal, deux paires de lunettes de soleil."}),
   B("Fouiller le gros sac du Portugal", S=>S.kb===3?'alex_trouve':'alex_cles', {t:5, fx:S=>{ S.tries++; if (S.tries >= 2) S.kb = 99; }, note:"Un pull à trois manches et un citron."}),
   B("Lui montrer qu'elles sont dans sa main", 'alex_trouve', {t:5})
  ]},
 alex_trouve: {p:"Part de Folie · Alexandra", who:'alexandra',
  text:"Les clés étaient dans sa main depuis le début. Alexandra éclate de rire et te serre dans ses bras. « Tu es mon héros ! Prends ça, c'est pour Yann. » Elle sort de ses sacs une bouteille de vinho verde et une boîte de pastéis de nata.",
  c:[B("Merci Alexandra", 'partdefolie', {t:5, items:['vinho','pasteis']})]},
 alex_festival: {p:"Part de Folie · le festival", who:'alexandra',
  text:"« Le plan : on part en juillet, on dort sous la tente, on mange des frites, on voit trois concerts par jour. » Elle dessine la carte sur une serviette, avec une légende. « Et avant, la doro party : JC m'a dit que Gabie y serait aussi. » Elle perd le fil, le reprend. « Tu en es ? Tu en es ? »",
  c:[
   B("Dire oui pour lui faire plaisir", 'alex_billets', {t:15}),
   B("Lui dire que tu verras en juillet", 'alex', {t:5}),
   B("Changer de sujet", 'alex', {t:5})
  ]},
 alex_billets: {p:"Part de Folie · les billets", who:'alexandra',
  text:"« Parfait, je te réserve deux billets. » Elle sort son téléphone, qu'elle avait finalement dans sa poche, et réserve. Elle t'écrit le code de confirmation. Elle ne te lâche plus.",
  c:[
   B("Lui dire que tu dois partir chez Yann", 'alex', {t:10}),
   B("Rester pour finir de réserver l'hôtel", 'fin_festival', {t:30})
  ]},
 fin_festival: {end:'lose', h:"Deux billets pour juillet",
  text:"Tu as tellement écouté son plan que tu as réservé deux billets pour un festival en juillet, avec une tente et un hôtel. Il est 00h12. Alexandra a retrouvé son téléphone. Yann, lui, est déjà totalement torché."},

 /* ---------- Virgile ---------- */
 virgile: {p:"Les hauteurs · Cormeilles", who:'virgile',
  text:"La montée t'a coupé les jambes. Virgile ouvre en tee-shirt, un ordinateur portable sous le bras. Il referme l'écran d'un geste sec, mais pas assez vite pour que tu ne voies pas une fenêtre de terminal. « Je ne peux pas t'en parler. C'est lié à l'armée. » Tu n'as encore rien demandé.\n\nDerrière lui, Katia ouvre une Ruby : « Viril, c'est qui ? »",
  c:[
   B("Lui demander la Mazda pour te dépanner", 'mazda_q', {t:5}),
   B("Lui demander son métier", 'virgile_job', {t:5}),
   B("Lui demander l'heure", 'virgile_heure', {t:5}),
   B("Accepter la Ruby de Katia", 'katia', {t:5}),
   B("Redescendre", 'rue', {t:10})
  ]},
 virgile_job: {p:"Les hauteurs · Cormeilles", who:'virgile',
  text:S=>"« C'est un jeu vidéo ? » « Je ne peux pas t'en parler. » « Une appli ? » « Je ne peux pas t'en parler. » « Un logiciel qui lit dans les pensées ? » Il hésite une seconde. « Je ne peux pas t'en parler. » Tu as maintenant la certitude que c'est un logiciel. Virgile aussi, mais il ne le dit pas.",
  c:[
   B("Continuer à deviner", 'virgile_job', {t:5, note:"« Quelque chose avec des drones ? » Il a refermé son ordinateur sans un mot. Ça veut peut-être dire oui."}),
   B("Lui proposer un deal : plus de questions contre la Mazda", 'mazda_q', {t:5}),
   B("Arrêter là", 'virgile', {t:5})
  ]},
 virgile_heure: {p:"Les hauteurs · Cormeilles", who:'virgile',
  text:"« Je ne peux pas t'en parler. » Il répète quand tu précises que c'est juste l'heure. Katia lui arrache le téléphone : « Il est {time}, Viril. »\n\nIl te glisse une enveloppe cachetée : « À ouvrir à minuit. Ne me demande rien. »",
  c:[
   B("Prendre l'enveloppe", 'virgile', {t:5, item:'enveloppe'}),
   B("La lui rendre, ça fait peur", 'virgile', {t:5})
  ]},
 katia: {p:"Les hauteurs · Cormeilles", who:'katia',
  text:"Katia te tend une Ruby déjà ouverte. « Pour moi, c'est toujours midi, mon chou. Et si JC parle de sa doro party, je veux en être. » Elle lève un doigt. « On fait une chèvre ? C'est ma quinzième de la soirée. » Elle te regarde droit dans les yeux, et refuser ne semble pas une option.",
  c:[
   B("Trinquer, une seule", 'katia_deal', {t:10, item:'ruby'}),
   B("Jouer à la chèvre avec elle", 'fin_katia', {t:30}),
   B("Refuser poliment", 'virgile', {t:5})
  ]},
 katia_deal: {p:"Les hauteurs · Cormeilles", who:'katia',
  text:"Katia aime les gens qui trinquent. « Tu veux les clés de la Mazda ? Elles sont au congélateur, avec les glaçons. Viril ne regarde jamais là. » Elle rit. « Prends-les, il ne les cherchera pas avant minuit. »",
  c:[
   B("Prendre les clés dans le congélateur", 'virgile', {t:5, flag:'cles', note:"Les clés sont glacées. Katia applaudit."}),
   B("Les laisser, c'est trop risqué", 'virgile', {t:5})
  ]},
 fin_katia: {end:'lose', h:"Une dernière, trois fois",
  text:"Tu as dit « une dernière » trois fois. À minuit, tu es plié en deux dans un coin du jardin de Virgile, un verre d'eau dans une main et ta dignité dans l'autre. Katia, elle, entame sa dix-septième chèvre. Tu n'es plus en état d'aller chez Yann."},
 mazda_q: {p:"Les hauteurs · la Mazda", who:'virgile',
  text:S=>"Virgile regarde sa Mazda comme un ancien combattant. Katia veut qu'il la vende pour une voiture « plus sérieuse ».\n\n"+(S.flags.cles
   ? "Tu as les clés. Virgile les voit dans ta main : « Je ne peux pas t'en parler. » Il soupire et monte. « Dernier trajet. »"
   : "« Les clés ? Je ne peux pas t'en parler. » Il fouille ses poches, son bureau, le sac de sport. Il ne les trouve pas."),
  c:[
   B("Monter avec Virgile et Katia", 'mazda_depart', {t:10, need:S=>S.flags.cles}),
   B("Chercher les clés avec Katia", 'katia', {t:5, need:S=>!S.flags.cles}),
   B("Refuser, trop d'émotions", 'virgile', {t:5})
  ]},
 mazda_depart: {p:"En route · la Mazda", who:'virgile',
  text:"Virgile démarre sans un mot. Katia, à l'arrière, ouvre une autre Ruby. Le compteur dit « réserve » depuis le début. « Je ne peux pas t'en parler », dit Virgile en regardant le voyant.",
  c:[
   B("Passer à la station-service", 'station', {t:10}),
   B("Rouler jusqu'au bout", 'mazda_panne', {t:5, fx:S=>{ S.pass = rnd(0.5); }, to:S=>S.pass?'mazda_arrivee':'mazda_panne'})
  ]},
 station: {p:"Station-service · Cormeilles", who:'virgile',
  text:"Un pompiste fatigué, en gilet fluo, te regarde derrière sa vitre. « Vous voulez quoi ? Carburant, café ou philosophie ? » Virgile ne dit rien. Katia dort à moitié.",
  c:[
   B("Faire le plein (10 €)", 'mazda_arrivee', {t:10, m:-10, lock:pay(10)}),
   B("Demander au pompiste de faire crédit", 'station_credit', {t:5}),
   B("Prendre juste un café et repartir", 'mazda_arrivee', {t:5, fx:S=>{ S.pass = rnd(0.5); }, to:S=>S.pass?'mazda_arrivee':'mazda_panne'})
  ]},
 station_credit: {p:"Station-service · Cormeilles", who:'virgile',
  text:"Le pompiste hoche la tête. « Je ne fais pas crédit. Mais je vois que vous êtes entre amis. Allez, c'est cadeau. » Il remplit à moitié. Virgile le regarde comme on regarde un héros.",
  c:[B("Merci, vraiment", 'mazda_arrivee', {t:5})]},
 mazda_panne: {p:"En route · la Mazda", who:'virgile',
  text:"La Mazda tousse, hoquette, ralentit, et s'arrête au milieu d'une route sans lampadaire. « Je ne peux pas t'en parler », murmure Virgile. Katia sort une Ruby de son sac, elle en avait gardé une. Ça ne règle pas la panne, mais ça l'améliore.",
  c:[
   B("Pousser la voiture jusqu'à la station", 'station', {t:25, flag:'essouffle'}),
   B("Attendre qu'un automobiliste s'arrête", 'mazda_arrivee', {t:35})
  ]},
 mazda_arrivee: {p:"En route · la Mazda", who:'virgile',
  text:"La Mazda file dans la nuit. Katia chante en espagnol, Virgile garde les deux mains sur le volant comme s'il disait adieu. À un feu, son téléphone sonne : « Je ne peux pas répondre. C'est… » Il coupe.",
  c:[B("Arriver à Saint-Gratien", S=>maybe(S,'saintgratien',0.3), {t:20, note:"Virgile t'a dit : « Si je te dis que ça fait cinq mois que je cherche une Mazda aussi bien… je ne peux pas t'en parler. » Il n'a rien d'autre à dire."})]},

 /* ---------- Parents d'Arthur et de Micka ---------- */
 parents: {p:"Les deux maisons côte à côte · Cormeilles",
  text:"À gauche, Marielle et Fabien, les parents d'Arthur. À droite, les parents de Micka. Une seule fenêtre est allumée, et tu ne sais plus laquelle.",
  c:[
   B("Sonner chez Marielle et Fabien", 'marielle', {t:5}),
   B("Sonner chez les parents de Micka", 'micka', {t:5}),
   B("Retourner dans la rue", 'rue', {t:5})
  ]},
 marielle: {p:"Chez Marielle et Fabien · Cormeilles",
  text:S=>(S.player==='arthur'
   ? "Ta mère ouvre avant le deuxième coup de sonnette : « Tu manges un morceau ? » Ton père est dans le salon, devant l'étagère."
   : "Marielle ouvre avant le deuxième coup de sonnette : « Tu manges un morceau ? » Fabien est dans le salon, devant l'étagère. Arthur est là, en famille pour le réveillon.")
   +"\n\nAu milieu des cadres, la photo du cross du collège : coupe de mouton, un peu bouboule, des lunettes, l'air d'un garçon qui n'a jamais couru de sa vie. Aujourd'hui, il fait du crossfit.",
  c:[
   B("Demander où est Arthur", 'arthur', {t:5}),
   B("Commenter la photo à voix haute", 'arthur_photo', {t:5}),
   B("Suivre Marielle à la cuisine", 'marielle_cuisine', {t:5}),
   B("Écouter Fabien parler du cross", 'fabien', {t:5}),
   B("Remercier et ressortir", 'parents', {t:5})
  ]},
 marielle_cuisine: {p:"Chez Marielle et Fabien · la cuisine",
  text:"Une quiche sort du four. Marielle te regarde avec une tendresse alarmante. « Tu manges un morceau, et je t'en mets pour Yann. C'est un garçon qui travaille trop. »",
  c:[
   B("Manger une part et emporter la quiche", 'marielle', {t:20, item:'quiche'}),
   B("Juste emporter la quiche", 'marielle', {t:5, item:'quiche', note:"Marielle a insisté pour que tu manges aussi. Tu as dit non avec toute la fermeté d'un homme qui n'est pas capable de dire non."}),
   B("Retourner dans le salon", 'marielle', {t:5})
  ]},
 fabien: {p:"Chez Marielle et Fabien · le salon",
  text:"Fabien commence à raconter le cross du collège, avec la météo, la boue, les chaussures et le classement. « Il y avait un vent de face dans la montée. Je me rappelle parfaitement. » Il se rappelle surtout trop.",
  c:[
   B("Écouter jusqu'au bout", 'marielle', {t:25}),
   B("Lui dire que tu dois partir", 'marielle', {t:5})
  ]},
 arthur: {p:"Chez Marielle et Fabien · Cormeilles", who:'arthur',
  text:"Arthur enchaîne des squats sautés entre le canapé et la table basse, en se regardant dans la vitre du four, le torse un peu plus bombé à chaque rebond.\n\nSon téléphone vibre sur la table : « Carole 💘 ». Il le retourne face contre le bois, avec un sourire d'adolescent.\n\n« Un coup de main pour Saint-Gratien ? Facile : on y va en courant. » Il a déjà décidé.",
  c:[
   B("Accepter de courir avec lui", 'arthur_burpees', {t:5}),
   B("Lui parler de la photo du cross", 'arthur_photo', {t:5}),
   B("Refuser", 'marielle', {t:5})
  ]},
 arthur_burpees: {p:"Chez Marielle et Fabien · Cormeilles", who:'arthur',
  text:"« D'abord dix burpees. Règle de la maison. » Marielle compte à voix haute depuis la cuisine. Fabien filme.",
  c:[
   B("Faire les dix burpees", 'arthur_burpees_ok', {t:15}),
   B("Négocier à cinq", 'arthur_burpees_ok', {t:10, fx:S=>{ S.pass = rnd(0.5); }, to:S=>S.pass?'arthur_burpees_ok':'arthur_burpees_plus'}),
   B("Renoncer", 'marielle', {t:5})
  ]},
 arthur_burpees_plus: {p:"Chez Marielle et Fabien · Cormeilles", who:'arthur',
  text:"« Cinq ? Négociation refusée. Quinze. » Arthur en fait aussi, pour que ce soit « équitable ». Marielle compte en riant. Fabien filme toujours.",
  c:[B("Faire les quinze burpees", 'arthur_burpees_ok', {t:20, flag:'essouffle'})]},
 arthur_burpees_ok: {p:"Chez Marielle et Fabien · Cormeilles", who:'arthur',
  text:"« Parfait. Je me change. » Arthur disparaît dans sa chambre. Il revient, quinze minutes plus tard, en tenue de course technique, avec une gourde et une montre qui bipe. Il y a une raison pour laquelle c'est lui qui est très beau.",
  c:[B("Partir avec lui", 'course_a1', {t:15})]},
 arthur_photo: {p:"Chez Marielle et Fabien · Cormeilles", who:'arthur',
  text:"Tu parles de la photo. Arthur se fige. « Cette photo n'existe pas. » Il enchaîne dix burpees de pure gêne, très propres, très rapides.",
  c:[
   B("Lui dire que le changement est impressionnant, c'est vrai", 'course_a1', {t:10, note:"Arthur, touché, annule les burpees. Il te tape sur l'épaule avec la force d'un homme qui fait du crossfit."}),
   B("Insister : coupe de mouton, lunettes, tout", 'fin_burpees', {t:10})
  ]},
 course_a1: {p:"En route avec Arthur · la première côte", who:'arthur',
  text:"Arthur court comme on respire. Toi, tu respires un peu moins. À la première côte, il t'explique le « rythme cible ». Tu n'as plus assez d'air pour répondre.",
  c:[
   B("Tenir le rythme", S=>maybe(S,'course_a2',0.5), {t:20}),
   B("Ralentir et marcher un peu", S=>maybe(S,'course_a2',0.5), {t:30, flag:'essouffle'})
  ]},
 course_a2: {p:"En route avec Arthur · le milieu du trajet", who:'arthur',
  text:"Arthur se regarde dans la vitrine d'un magasin, sans ralentir. « Encore deux kilomètres. » Il l'a déjà dit quatre fois. À droite, une rue plus courte mais pleine de cailloux.",
  c:[
   B("Suivre Arthur sur la route principale", 'course_a3', {t:20}),
   B("Prendre le raccourci aux cailloux", 'course_a3', {t:10, flag:'essouffle'})
  ]},
 course_a3: {p:"En route avec Arthur · la dernière ligne droite", who:'arthur',
  text:"La dernière ligne droite. Arthur s'étire sans s'arrêter. Tu vois des lumières, des guirlandes, des gens qui rient à une fenêtre. Saint-Gratien.",
  c:[B("Arriver, le souffle court", 'saintgratien', {t:15, flag:'essouffle'})]},
 fin_teleporteur: {end:'hidden', h:"Livraison par la Guadeloupe",
  text:S=>"Chrisly s'arrête net. Il sent l'odeur, ferme les yeux, et pendant trois secondes il a dix ans, une plage et sa grand-mère. « Ça vient de Cindy ? Alors tu as droit à ça. » Il fouille sous les chaussettes de sa valise et en sort un cylindre en laiton, étiquette « Brevet Pointe-à-Pitre, ne pas secouer ». « Mon oncle l'a bricolé. Dis le nom de la maison où tu veux aller. »\n\nTu dis « Yann ». Un coup de tonnerre, une odeur de vanille et de rhum, le quai se plie en deux comme une carte, et tu atterris "+(S.player==='yann'?"sur ton propre paillasson":"sur le paillasson de Yann")+", à minuit moins une, avec le cadeau de Cindy à la main. "+(S.player==='yann'?"Maël, qui juge ce soir, ouvre la porte, le stylo déjà sorti":"Yann ouvre en robe de chambre, le stylo du jury déjà sorti")+". « Tu n'es pas passé par la rue, ni par le jardin. Je ne sais pas si je dois te noter ou appeler quelqu'un. »\n\nDerrière toi, le téléporteur fait « pouf » et repart vers Franconville, où Chrisly mange déjà le colombo de sa mère. C'est la première fois que quelqu'un arrive chez "+(S.player==='yann'?"toi":"Yann")+" en passant par la Guadeloupe.",
  c:[]},
 fin_burpees: {end:'lose', h:"Cinquante burpees",
  text:"Cinquante burpees, offerts par Arthur, sous le regard de Marielle, de Fabien et du cadre. À minuit, tu es au sol entre le canapé et la table basse, et le cadre te regarde. Il a gagné."},
 micka: {p:"Chez les parents de Micka · Cormeilles", who:'micka',
  text:S=>S.flags.chien_pris
   ? (S.bag.indexOf('chien')>=0
      ? "Micka est sur le perron, les mains vides, et regarde le chien dans tes bras comme un père regarde un enfant parti en colo. « Il a mangé ? Il a fait pipi ? Il aime pas le gravier. » Le chien éternue, comme pour confirmer."
      : "Micka est sur le perron, les mains vides. « Où est le chien ? » Tu ne sais pas quoi répondre. « Je lui fais confiance », dit-il, pas du tout rassuré.")
   : "Micka sort sur le perron avec une sorte de petit chien qui tire la langue de travers et te regarde comme on regarde un huissier. « Il fait sa promenade du soir, dit Micka. Aurélie a décrété que c'était mon tour. » Le chien éternue, très fort, sur ta chaussure.",
  c:[
   B("« Il est trop mignon ! »", 'micka_ok', {t:5, need:S=>!S.flags.chien_pris}),
   B("« Il ressemble à quoi, exactement ? »", 'micka_quoi', {t:5, need:S=>!S.flags.chien_pris}),
   B("« Il est franchement moche »", 'fin_chien', {t:5, need:S=>!S.flags.chien_pris}),
   B("« Tout va bien, je le ramène avant minuit »", 'parents', {t:5, need:S=>!!S.flags.chien_pris}),
   B("Laisser Micka tranquille", 'parents', {t:5, need:S=>!S.flags.chien_pris})
  ]},
 micka_quoi: {p:"Chez les parents de Micka · Cormeilles", who:'micka',

 audrey_ok: {p:"Parvis de la gare · Cormeilles", who:'audrey',
  text:S=>"« Merci, vraiment, tu me sauves. » Audrey te sourit, soulagée. Elle fouille dans le sac, en sort une bouteille de crémant. « Tiens. Pour Yann. Il m'a fait promettre de bien choisir, et je crois que tu l'as mérité. » Elle hésite, puis ajoute, en fouillant encore : « Ah, et l'objet qui cliquette, c'est un cadenas que m'a donné l'ancien gérant du Carrefour City de Saint-Gratien, Jérôme. Il m'a dit que le coffre de sa réserve finissait par "+S.codeB+". Je ne sais pas pourquoi il me raconte ça. Je suppose qu'il avait besoin d'en parler. »",

 audrey_vape: {p:"Parvis de la gare · Cormeilles", who:'audrey',

 mael_d1: {p:"Le Plessis-Bouchard · le banc de Maël", who:'mael',

 jc_doro: {p:"La gare · Cormeilles", who:'jc',

   ? "Tu quittes la route pour suivre un bruit de moteur qui n'est pas le tien. Un champ, un chemin, une zone industrielle sans nom. Sur un banc, au milieu de nulle part, sous un lampadaire qui clignote, Cindy, valise à roulettes, partage un thermos avec personne. « Je suis en Guadeloupe, pas de commentaire. Toi aussi, tu es perdu ? » Elle monte derrière toi. À minuit, vous êtes chez Yann. Personne ne demande ce que vous apportez."
   : S.player==='cindy'
   ? "Tu quittes la route pour suivre un bruit de moteur. Un champ, un chemin, une zone industrielle sans nom. Sur un banc, au milieu de nulle part, sous un lampadaire qui clignote, Antonin, casque sur les genoux, mange un morceau de fromage. « Ah, te voilà. Venez par là, c'est chez Yann. » Tu montes derrière lui. À minuit, vous êtes chez Yann. Personne ne demande ce que vous apportez."
   : "Tu quittes la route pour suivre un bruit de moteur. Un champ, un chemin, une zone industrielle sans nom. Sur un banc, au milieu de nulle part, sous un lampadaire qui clignote, Antonin et Cindy partagent un thermos. « Ah, te voilà. On t'attendait. » Cindy : « Je suis en Guadeloupe, pas de commentaire. » Antonin te tend un casque : « Venez par là, c'est chez Yann. » Tu ne sais pas comment, mais à minuit tu es chez Yann, les mains vides, avec un casque et un thermos. Pour une fois, personne ne demande ce que tu apportes : on ne dit pas non à quelqu'un qui arrive avec Antonin et Cindy."},
 marche3: {p:"À pied · la fin du trajet",
  text:"Au loin, tu vois des guirlandes, des lumières, un panneau qui annonce Saint-Gratien. Tu ne sens plus tes chevilles. Tu y es presque.",

 /* ---------- Lycée ---------- */
lycee: {p:"Le lycée Philippe Kieffer · Cormeilles", who:'marco',
  text:"Vacances : le portail est à moitié ouvert. Un gardien en gilet jaune t'arrête : « Où allez-vous, jeune homme ? » Derrière lui, tu aperçois Marco qui traverse la cour, un énorme sac sur l'épaule, plié en deux sous le poids.",

 lycee_gardien: {p:"Le portail du lycée · Cormeilles", who:'marco',
  text:"« Un cadeau, au lycée ? » Le gardien se redresse, croise les bras sur son gilet jaune, puis son visage s'adoucit. « Je m'appelle Gérard. Vingt-deux ans que je garde ce portail. J'ai vu des élèves devenir profs, des profs devenir fantômes, et un photocopieur survivre à tout. » Il regarde la cour. « Je ne peux pas t'aider, mais je peux te parler. »",
  c:[

 lycee_phone: {p:"Le lycée Philippe Kieffer · la cour", who:'marco',

 citystade: {p:"Le city-stade · Cormeilles",

 citystade_jeunes: {p:"Le city-stade · Cormeilles",

 louis: {p:"Le city-stade · Cormeilles", who:'louis',
  text:"Dans les cages, un type de taille normale, immobile, bras écartés, joue seul contre des tirs imaginaires. Son crâne rasé brille sous le projecteur comme celui de Barthez en finale, et sa tenue est si neuve qu'elle craque : maillot repassé, short à plis, gants avec l'étiquette encore accrochée. Il te regarde sans cligner.\n\n« Je m'appelle Louis. Cinq penalties. Tu en mets trois, je te donne quelque chose. »",

 louis_win: {p:"Le city-stade · Cormeilles",

 citystade_ok: {p:"Le city-stade · Cormeilles",

 /* ---------- Appels et amis conducteurs ---------- */
 cindy_appel: {p:"Un coup de fil · Guadeloupe", who:'cindy',
  text:"Cindy décroche à la première sonnerie, la voix pleine de soleil. « Ici, il est dix-sept heures, il fait vingt-huit degrés, j'ai un ti-punch dans une main et les pieds dans le sable. Je suis en Guadeloupe jusqu'à jeudi, donc tu ne m'appelles pas. » Derrière elle, des vagues et un haut-parleur de buvette qui passe du zouk. « Dis-moi vite, je n'ai pas de forfait pour ça. »",
  c:[
   B("Lui demander ce qu'aimerait {Y}", S=>S.pass?'cindy_conseil':'cindy_conseil_ko', {t:5, fx:S=>{ S.pass = rnd(0.5); }}),
   B("Lui demander de réveiller Antonin pour toi", S=>S.pass?'cindy_antonin':'cindy_antonin_ko', {t:5, fx:S=>{ S.pass = rnd(0.4); }}),
   B("Raccrocher", 'appel', {t:0})
  ]},
 cindy_conseil: {p:"Un coup de fil · Guadeloupe", who:'cindy',
  text:S=>"« {Y} ? Il dit qu'il aime le blanc sec, mais il boit ce qu'on lui sert. Ce qu'il adore, c'est ce qui raconte une histoire. Une bouteille avec une étiquette bizarre, un objet qu'on ne sait pas nommer, un souvenir. » Un silence, le bruit d'un verre qu'on repose. « Ne dis pas que c'est moi. » Puis, plus bas : « Au fait. Quand je faisais des extras au Carrefour City de Saint-Gratien, il y avait un coffre-fort dans la réserve, derrière les palettes. Le début du code, c'est "+S.codeA+". Je ne me souviens plus de la fin. Tu ne m'as pas entendue. »",
  c:[B("Merci, bon vol", 'appel', {t:0, flag:'code_a', note:"Tu notes le début du code au stylo, dans ta paume."})]},
 cindy_conseil_ko: {p:"Un coup de fil · Guadeloupe", who:'cindy',
  text:"« {Y} ? Facile. Il adore la simplicité. Des chips nature, rien d'autre, c'est son péché mignon. Je te le jure sur ma valise. » Le zouk de la buvette couvre sa voix, elle ajoute quelque chose que tu n'entends pas, puis elle raccroche. Elle avait la voix de quelqu'un qui n'a pas dormi depuis deux jours.",
  c:[B("Raccrocher, un peu inquiet", 'appel', {t:0})]},
 cindy_antonin: {p:"Un coup de fil · Cindy et Antonin", who:'antonin',
  text:"« Attends, j'appelle Antonin. » Cindy lance un appel à trois. Trois sonneries, puis une voix pleine de vent : « Allô ? Je suis dans un col. — Tu es dans ton salon, Antonin, dit Cindy. — Ah. Oui. Dans le col de mon salon. » Elle lui explique, très vite, que tu es à Cormeilles, que c'est urgent, que Yann attend. « Je prends un casque en plus », soupire-t-il. Cindy, satisfaite : « Voilà. Bonne année, je dors. »",
  c:[
   B("Monter derrière Antonin", 'moto1', {t:10}),
   B("Remercier et raccrocher", 'appel', {t:0})
  ]},
 cindy_antonin_ko: {p:"Un coup de fil · Cindy et Antonin", who:'antonin',
  text:"« Attends, j'appelle Antonin. » Cindy lance un appel à trois. Antonin décroche dans un bruit de moteur et de vent : « Allô ? J'entends rien. Vous êtes qui ? » Cindy lui crie ton adresse, puis sa batterie lâche. Antonin, seul avec toi : « Cormeilles ? Je suis à Chambéry, mais je fonce. Comptez quarante minutes. Ou une heure et demie. » Il raccroche.",
  c:[
   B("Attendre sur le trottoir", 'moto1', {t:75, note:"Antonin est arrivé à 21h10, avec un fromage dans sa sacoche et aucune excuse."}),
   B("Laisser tomber et repartir", 'appel', {t:5})
  ]},
 cindy_porte: {p:"Devant chez Cindy · Conflans", who:'cindy',
  text:S=>S.flags.c_pris
   ? "La voisine de Cindy te regarde par la fenêtre, le carton est vide, les volets sont toujours fermés. « Elle a dit une chose, pas deux. »"
   : "La porte de Cindy est fermée, les volets aussi, et un autocollant d'aéroport est resté collé sur la boîte aux lettres. Sa voisine, en robe de chambre, sort sur le palier : « Cindy m'a laissé un carton pour quelqu'un qui passerait. Elle a dit : « Une seule chose, pas deux, et pas de questions. » Je n'en ai pas posé. » Dans le carton, un punch coco de Guadeloupe, des tourments d'amour emballés un par un, et un objet lourd enveloppé dans une page de journal tachée de rhum.",
  c:[
   B("Demander à la voisine ce qu'il y a vraiment dedans", 'cindy_porte', {t:5, flag:'c_demande', need:S=>!S.flags.c_pris && !S.flags.c_demande, note:"« Elle a dit de ne pas ouvrir l'objet enveloppé, et de ne pas le laisser au soleil. Je n'ai pas compris. »"}),
   B("Prendre le punch coco", 'cindy_porte', {t:5, item:'the_cindy', flag:'c_pris', need:S=>!S.flags.c_pris, note:"La voisine hoche la tête : « Il paraît qu'il se boit très frais. »"}),
   B("Prendre les tourments d'amour", 'cindy_porte', {t:5, item:'biscuits_cindy', flag:'c_pris', need:S=>!S.flags.c_pris, fx:S=>{ if (rnd(0.4)) S.bag = S.bag.map(b=>b==='biscuits_cindy'?'biscuits_perimes':b); }, note:"« Elle en a mis trop, dit la voisine. Elle fait toujours trop. »"}),
   B("Prendre l'objet enveloppé", 'cindy_porte', {t:5, item:'souvenir_cindy', flag:'c_pris', need:S=>!S.flags.c_pris, fx:S=>{ if (rnd(0.5)) S.bag = S.bag.map(b=>b==='souvenir_cindy'?'durian':b); }, note:"La voisine détourne les yeux : « Je n'ai rien vu. »"}),
   B("Repartir dans la rue", 'rue', {t:5})
  ]},
 antonin_garage: {p:"Le hangar d'Antonin · Cormeilles", who:'antonin',
  text:"Le hangar d'Antonin sent l'huile et le kérosène. Au fond, un hélicoptère au capot levé : Antonin répare et entretient des hélicoptères, et il en parle comme d'autres parlent de leur chat. Sa moto est sur la béquille, la chaîne démontée, encore couverte de la boue des cols. Il raconte son voyage à l'établi : trois cols, un orage, un refuge où l'on dort à six. « Je suis rentré hier soir, j'ai la tête encore là-haut. » Il s'essuie les mains sur un chiffon. « Tu viens pour Yann ? Je ne vends pas de cadeaux, mais je vends des trajets. »",
  c:[
   B("L'aider à remonter la chaîne", 'antonin_garage', {t:30, flag:'a_chaine', need:S=>!S.flags.a_chaine, note:"Tu as les mains noires jusqu'aux coudes. Antonin, ému : « Tu as le geste. »"}),
   B("Accepter l'hélicoptère qu'il te propose", 'antonin_heli', {t:10}),
   B("Lui demander d'essayer sa moto", 'fin_moto_solo', {t:5}),
   B("Lui demander de t'emmener à Saint-Gratien", 'moto1', {t:10, need:S=>S.flags.a_chaine, note:"Il décroche un casque du mur : « Monte, la chaîne est bonne. »"}),
   B("Lui demander de t'emmener à Saint-Gratien", 'antonin_non', {t:5, need:S=>!S.flags.a_chaine}),
   B("Repartir dans la rue", 'rue', {t:5})
  ]},
 antonin_heli: {p:"Dans l'hélicoptère d'Antonin", who:'antonin',
  text:"« Moto, c'est bien. Hélicoptère, c'est mieux. » Antonin te boucle un casque audio, vérifie trois cadrans, tape sur un quatrième. Le rotor se lance, le hangar s'envole sous vous. Cormeilles devient une carte, Saint-Gratien une constellation de guirlandes. « Parfait, on y est en quatre minutes. » Un silence. « On se pose où, au fait ? »",
  c:[
   B("Dans le jardin de Yann", 'antonin_heli2', {t:35}),
   B("Sur le parking du Carrefour", 'antonin_heli2', {t:35}),
   B("Sur le toit de la gare", 'antonin_heli2', {t:35})
  ]},
 antonin_heli2: {p:"Dans l'hélicoptère d'Antonin", who:'antonin',
  text:"Vous tournez au-dessus de Saint-Gratien. Le jardin de Yann a des arbres, le parking a des câbles, le toit de la gare a un contrôleur qui vous regarde. Vous essayez trois fois. Des voisins sortent sur leur balcon, certains filment, un chien aboie sans conviction. « Ah, dit Antonin. Je n'ai pas le droit de me poser ici. Je n'ai jamais eu le droit de me poser nulle part, en fait. » Vous refaites le trajet inverse en silence. Il est plus tard que prévu.",
  c:[B("Se poser au hangar d'Antonin", 'antonin_garage', {t:25, note:"Une heure de vol, zéro atterrissage. Antonin éteint le rotor : « Pour la moto, par contre, c'est sûr. »"})]},
 antonin_non: {p:"Le hangar d'Antonin · Cormeilles", who:'antonin',
  text:"« Pas avec la chaîne comme ça. On finit dans le fossé, et je tiens à ma moto. Aide-moi d'abord, je ne te demande que vingt minutes. » Il en faudra trente.",
  c:[B("Retourner à l'établi", 'antonin_garage', {t:0})]},
 fin_moto_solo: {end:'lose', h:"Pas de permis, beaucoup de courage",
  text:"« Je peux essayer ? » Antonin hésite, puis te tend le casque, ce qui est sa première erreur. Le hangar est encombré, la porte est fermée. La moto, elle, ne s'est pas posé la question. Tu finis dans l'étagère des pneus. Antonin, les mains sur la tête : « Elle démarre quand même, regarde ! » À minuit, tu es aux urgences avec un casque sur les genoux, et un message de Yann : « T'es où ? »"},
 fin_moto_col: {end:'hidden', h:"Les trois cols d'Antonin",
  text:"« Je connais un raccourci. » Ce n'est pas un raccourci. C'est un col, puis un deuxième, puis un chemin de chèvres qu'Antonin appelle « la voie douce ». À minuit pile, vous êtes dans un refuge, avec six inconnus, une marmite de soupe et un ronfleur. Ton téléphone n'a plus de réseau. Antonin lève sa cuillère : « Bonne année ! » Tu n'as pas de cadeau pour Yann, mais tu as une histoire de refuge pour la vie."},
 appel: {p:"Un coup de fil",
  text:"Tu sors ton téléphone. Qui tu appelles ?",
  c:[
   B("Anaïs, avec sa grosse voiture", 'anais', {t:5}),
   B("Moizlard, voiture américaine, cheville foulée", 'moizlard', {t:5}),
   B("Cindy, en Guadeloupe (cinq heures de moins là-bas)", 'cindy_appel', {who:'cindy', t:5}),
   B("Antonin, qui devrait être rentré de la montagne", S=>S.antonin?'antonin':'antonin_ko', {who:'antonin', t:5, fx:S=>{ S.antonin = rnd(0.5); }}),
   B(S=>S.player==='yann'?"Maël, pour avoir des indices":"Yann, pour avoir des indices", 'appel_yann', {t:5}),
   B("Raccrocher", 'rue', {t:0})
  ]},
 appel_yann: {p:"Un coup de fil · Yann",
  text:S=>S.player==='yann'
   ? "Maël décroche au troisième essai. « Allô ? Je suis dans ton salon, j'ai pas le temps. » Silence. « Écoute : un blanc sec bien frais, un truc à manger, et une surprise. Ne me fais pas faire la tête à minuit. » Il raccroche. Il a déjà ouvert ton frigo."
   : "Yann décroche au troisième essai. « Allô ? Je suis en train de goûter, j'ai pas le temps. » Silence. « Écoute : un blanc sec bien frais, un truc à manger, et une surprise. Ne me fais pas faire la tête à minuit. » Il raccroche. Il est déjà bien parti.",
  c:[B("Raccrocher", 'appel', {t:5})]},
 anais: {p:"Anaïs arrive", who:'anais',
  text:S=>"Anaïs arrive avec sa grosse voiture, vitre baissée, et ne coupe pas le moteur. « Tu montes. Ceinture. Tu ne discutes pas. »"+(S.player==='chrisly'?"":" Chrisly est assis à côté d'elle, sa valise sur les genoux.")+" Dans le porte-gobelet, un verre d'eau.",
  c:[
   B("Obéir : ceinture, silence", 'anais_route1', {t:5}),
   B("La présenter comme « la +1 de Chrisly »", 'anais_verre', {t:5}),

const YQ = [["Tu as su répondre à sa question sur le blanc : il hoche la tête avec un vrai respect.","Tu as raté sa question sur le blanc, mais ce que tu as apporté t'en fait pardonner."],["Tu savais d'où vient le vinho verde : {Y} t'a regardé avec un respect nouveau.","Tu t'es trompé de pays pour le vinho verde, mais {Y} a fait semblant de ne pas l'avoir entendu."],["Tu sais ouvrir une bouteille sans faire sauter le bouchon : {Y} t'a confié la prochaine.","Tu as mal répondu sur l'ouverture du crémant : {Y} ne te laissera pas ouvrir la bouteille."],["Tu connaissais le plus petit os du corps : {Y} t'a fait un diplôme honoraire sur une serviette.","Tu as raté sa question sur l'os de l'oreille : {Y} a noté ton nom avec une croix dans un carnet imaginaire."],["Tu connaissais le temps de lavage des mains : {Y} te montre déjà où se trouve le savon.","Tu as raté sa question sur le lavage des mains : {Y} te tend le savon, par principe."]];
function sc(S,id){ return id==='mystere' ? (S.mys?3:-2) : ITEMS[id].s; }
function resolve(S){
  if (!S.bag.length) return 'lose_mains';
  const kill = S.bag.find(b=>ITEMS[b] && ITEMS[b].kill);
  if (kill) { S.best = kill; return 'lose_'+kill; }
  const best = S.bag.reduce((a,b)=> sc(S,b) >= sc(S,a) ? b : a);
  S.best = best;
  if (sc(S,best) < 0) return best === 'mystere' ? 'lose_mystere' : 'lose_'+best;
  const ks = new Set(S.bag.filter(b=>sc(S,b)>0).map(b=>ITEMS[b].k));
  if (ks.size === 3) return 'win_parfait';
  return 'win_'+best;
}
function extras(S){
  const out = [];
  const yqt = YQ[S.yq == null ? 0 : S.yq];
  out.push(S.flags.bonvin ? yqt[0] : yqt[1]);
  if (S.flags.trempe) out.push("Tu es encore humide. « Anaïs ? » demande {Y} sans lever les yeux. Il avait deviné.");
  if (S.flags.pluie) out.push("Tu as de la pluie dans les cheveux. On te prête une serviette.");
  if (S.flags.essouffle) out.push("Tu as encore le souffle court : on te met un verre d'eau dans la main, et un siège sous toi.");
  if (S.flags.m_resp) out.push("Tu as tenu tête à Maël dans un débat : il en parle encore, avec une admiration qu'il ne cache pas.");
  if (S.flags.sacs) out.push("Tu as encore la marque de la poignée dans la main : tu as porté le sac d'Audrey, et elle t'a remercié deux fois.");
  if (S.flags.chapeau) out.push("Tu portes un chapeau de pingouin, que personne n'ose commenter.");
  if (S.flags.tiktok) out.push("On t'a reconnu : tu es dans le fond d'une vidéo TikTok à 14 vues.");
  if (S.flags.pv) out.push("Un contrôleur t'a donné une amende pour être là. Tu ne le diras à personne.");
  const neg = S.bag.find(b=>sc(S,b)<0);
  if (neg) out.push("Au fond de ta poche, tu gardes « "+ITEMS[neg].n+" ». Personne n'a besoin de le savoir.");
  out.push("À minuit, tout le monde trinque, et tu es là.");
  return out.join("\n\n");
}
function winText(S,id){
  const it = ITEMS[id];

    : "{Y} ouvre la porte, un verre déjà à la main. Il est {time}, il reste {left} avant minuit.";
  return intro+"\n\n"+it.w+"\n\n"+extras(S);
}

const EVENTS = ['ev_moto','ev_cindy','ev_tarte','ev_dame','ev_livreur','ev_ados','ev_arnaque','ev_fetards','ev_meteo','ev_tiktok','ev_yann','ev_boulangere'];
function cindyGift(S){ return ['the_cindy','biscuits_cindy','souvenir_cindy'].find(k=>S.bag.indexOf(k) >= 0) || null; }
function maybe(S, dest, p){
  S.seen = S.seen || {};
  const SKIP = {ev_moto:'antonin', ev_cindy:'cindy'};
  const pool = EVENTS.filter(e=>!S.seen[e] && SKIP[e] !== S.player);
  const forced = (S.player === 'arthur' || S.player === 'gabie') && !S.seen.ev_tarte;
  if (forced || (pool.length && Math.random() < (p == null ? 0.3 : p))){
    const e = forced ? 'ev_tarte' : pool[Math.floor(Math.random()*pool.length)];
    S.seen[e] = 1; S.next = dest; return e;
  }
  return dest;
}
