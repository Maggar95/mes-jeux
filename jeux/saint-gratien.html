const $ = id => document.getElementById(id);
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
/* Fins trouvées : gardées par prénom, sur cet appareil (id de la fin -> titre) */
function foundMap(p){ return (window.Endings && Endings.found(p)) || {}; }
function foundSet(p){
  let m = foundMap(p);
  if (!Object.keys(m).length && p && p === store('dsg-pseudo')){
    try {   /* reprend l'ancienne liste, enregistrée avant les prénoms */
      const old = JSON.parse(store('dsg-ends') || '[]'); m = {};
      old.forEach(id=>{ if (SCENES[id] && SCENES[id].end) m[id] = fill(SCENES[id].h); });
      if (old.length) store(Endings.key(p), JSON.stringify(m));
    } catch (e) { m = {}; }
  }
  return new Set(Object.keys(m));
}
const ENDS = Object.keys(SCENES).filter(k=>SCENES[k].end);

function fill(str){
  return String(str).replace(/\{(\w+)\}/g,(m,k)=>{
    switch(k){
      case 'time': return fmt(S.t);
      case 'm': return eur(S.m);
      case 'Y': return Y(S);
      case 'left': return leftTxt(S.t);
      case 'name': return S.pseudo || NAMES[S.player];
      default: return m;
    }
  });
}
function val(x){ return typeof x === 'function' ? x(S) : x; }
function clearTimer(){ if (timerId){ clearTimeout(timerId); timerId = null; } if (typeof EVA !== 'undefined') EVA.stop(); if (typeof PEN !== 'undefined') PEN.stop(); if (typeof JOB !== 'undefined') JOB.stop(); }

function newGame(p, pseudo){
  S = {player:p, pseudo:pseudo || NAMES[p], codeA:'03', codeB:'37', t:0, m:20, bag:[], flags:{}, note:'', best:null, win:false, antonin:false, pass:false, ticket:null, seen:{}, stock:newStock(), mys:false, next:'rue', kb:0, tries:0, yq:0};

  showOnly('game');
  goTo('eva');
}

function goTo(id){
  clearTimer();
  let sc = SCENES[id];
  if (sc.who && (Array.isArray(sc.who) ? sc.who.indexOf(S.player) >= 0 : sc.who === S.player)){ id = sc.alt || 'rue'; sc = SCENES[id]; }
  S.scene = id;
  MAP.visit(id, sc);
  if (sc.end) return showEnd(id, sc);
  showScene(id, sc);
}

function askDrop(id, bag, cb){
  const box = $('scene'); box.textContent = '';
  box.appendChild(el('div','place','Ton sac est plein'));
  const txt = el('div','txt');
  txt.appendChild(el('p',null,"Tu portes déjà trois choses. Pour prendre « "+ITEMS[id].n+" », tu dois en lâcher une. Laquelle ?"));
  box.appendChild(txt);
  const list = el('div','choices');
  bag.forEach((b,k)=>{
    const btn = el('button','choice'); btn.type = 'button';
    btn.appendChild(el('span','lab','Lâcher « '+ITEMS[b].n+' »'));
    btn.addEventListener('click',()=>cb(k));
    list.appendChild(btn);
  });
  const no = el('button','choice'); no.type = 'button';
  no.appendChild(el('span','lab','Ne pas prendre « '+ITEMS[id].n+' »'));
  no.addEventListener('click',()=>cb(-1));
  list.appendChild(no);
  box.appendChild(list);
  box.scrollIntoView({block:'start'});
}

function pick(c){
  clearTimer();
  const ni = [c.item].concat(c.items || []).filter(i=>i && S.bag.indexOf(i) < 0);
  const bag = S.bag.slice(); let notes = '';
  (function step(i){
    if (i >= ni.length){ S.bag = bag; return applyChoice(c, notes); }
    const id = ni[i];
    if (bag.length < 3){ bag.push(id); return step(i+1); }
    askDrop(id, bag, k=>{
      if (k < 0) notes += " Tu laisses « "+ITEMS[id].n+" » où il est.";
      else { notes += " Tu lâches « "+ITEMS[bag[k]].n+" » pour prendre « "+ITEMS[id].n+" »."; bag.splice(k,1); bag.push(id); }
      step(i+1);
    });
  })(0);
}

function applyChoice(c, extra){
  S.t += c.t || 0; S.m = Math.round((S.m + (c.m || 0))*100)/100;
  if (c.flag) S.flags[c.flag] = true;
  if (c.fx) c.fx(S);
  let to = typeof c.to === 'function' ? c.to(S) : c.to;
  S.note = (c.note ? fill(c.note) : '') + extra;
  if (S.m > 50 && !SCENES[to].end && to.indexOf('chezyann') !== 0) to = 'fin_riche';
  if (S.t >= END_T && !SCENES[to].end) to = (to.indexOf('eva') === 0 ? 'fin_eva_nuit' : 'fin_minuit');
  goTo(to);
}

function updateBoard(sc){
  $('clock').textContent = fmtc(S.t);
  $('left').textContent = 'minuit dans '+leftTxt(S.t);
  $('money').textContent = eur(S.m);
  const bits = S.bag.map(b=>ITEMS[b].n);
  if (S.ticket === 'cheap') bits.push('Ticket Franconville');
  if (S.ticket === 'full') bits.push('Ticket Saint-Gratien');
  if (S.flags.code_a || S.flags.code_b) bits.push('Code du coffre : '+(S.flags.code_a?S.codeA:'··')+(S.flags.code_b?S.codeB:'··'));
  $('bag').textContent = bits.length ? bits.join(' · ') : 'rien';
  const ks = {};
  S.bag.forEach(b=>{ const s = (b === 'mystere') ? 1 : ITEMS[b].s; if (s > 0) ks[ITEMS[b].k] = true; });
  $('need').querySelectorAll('li').forEach(li=>{
    const ok = !!ks[li.dataset.k];
    li.classList.toggle('ok', ok);
    li.textContent = (ok ? '✓ ' : '') + li.dataset.label;
  });
  MAP.count();
}

function visibleChoices(sc){
  const list = (sc.c || []).filter(c=>{
    if (c.need && !c.need(S)) return false;
    const w = c.who || (typeof c.to === 'string' && SCENES[c.to] ? SCENES[c.to].who : null);
    return Array.isArray(w) ? w.indexOf(S.player) < 0 : w !== S.player;
  });
  if (!list.length) list.push({l:'Retourner dans la rue', to:'rue', t:5});
  return list;
}

  const boardBox = el('div','endcard'); boardBox.appendChild(el('h2',null,'Classement des fins'));
  const boardBody = el('div'); boardBody.appendChild(el('p','small','Chargement…')); boardBox.appendChild(boardBody);
  const full = el('a','small','Voir le classement complet'); full.href = '../classement.html?game=saint-gratien'; boardBox.appendChild(full);
  root.appendChild(card);
  root.appendChild(boardBox);
  window.scrollTo(0,0);
  recordAndShow(found.size, id, kind, fill(sc.h), status, boardBody);
}

function recordAndShow(points, id, kind, title, status, boardBody){
  if (!(window.MesJeux && MesJeux.ready())){
    status.textContent = "Le classement n'est pas encore branché : ce score n'est pas enregistré.";
    boardBody.textContent = ''; return;
  }
  const details = {ending:id, title:title, kind:kind, time:fmt(S.t), money:S.m, bag:S.bag.map(b=>ITEMS[b].n), character:S.player, total:ENDS.length};
  MesJeux.save('saint-gratien', S.pseudo, points, details).then(res=>{
    status.textContent = res.ok ? 'Score enregistré dans le classement.' : "Le score n'a pas pu être envoyé. Il sera renvoyé à la prochaine ouverture du jeu.";
    return MesJeux.list('saint-gratien', 1000);
  }).then(rows=>{
    Endings.renderBoard(boardBody, rows, {me:S.pseudo, limit:10, cls:'lb'});
  }).catch(()=>{ boardBody.textContent = ''; boardBody.appendChild(el('p','small',"Le classement n'a pas pu être lu pour le moment.")); });
}

renderStart();
</script>
