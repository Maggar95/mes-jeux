<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Le Franchisé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;700&display=swap">
<style>
/* Concept : un dossier de franchisé qu'on instruit année après année. Papier gris-bleu, encre marine, tampon bleu. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --ink: #14213d;
  --muted: #5b6578;
  --line: #d5dbe5;
  --accent: #1f4fbf;
  --accent-ink: #ffffff;
  --good: #17784a;
  --good-bg: #e3f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --cash: #8a5a00;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1626; --surface: #18223a; --surface-2: #1f2b47; --ink: #e8ecf5; --muted: #9aa5bc;
    --line: #2a3654; --accent: #7ea2ff; --accent-ink: #0f1626; --good: #5cd08f; --good-bg: #12301f;
    --bad: #ff8a80; --bad-bg: #3a1815; --cash: #f0bf5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #18223a; --surface-2: #1f2b47; --ink: #e8ecf5; --muted: #9aa5bc;
  --line: #2a3654; --accent: #7ea2ff; --accent-ink: #0f1626; --good: #5cd08f; --good-bg: #12301f;
  --bad: #ff8a80; --bad-bg: #3a1815; --cash: #f0bf5a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* En-tête : état du dossier */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.stage-label { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.meter { min-width: 0; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); font-weight: 500; }
.meter-val { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter-val.cash { color: var(--cash); }
.bar { height: 8px; background: var(--line); border-radius: 4px; margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
.bar.cash > i { background: var(--cash); }
.years { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
.yr { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-align: center; padding: 4px 0 3px; border-top: 3px solid var(--line); color: var(--muted); letter-spacing: 0.04em; }
.yr.done { border-top-color: var(--ink); color: var(--ink); }
.yr.now { border-top-color: var(--accent); color: var(--accent); }

/* Cartes */
main { padding-top: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.card + .card, .card + section, section + .card { margin-top: 16px; }
.tab { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 4px; padding: 3px 8px; margin-bottom: 14px; transform: rotate(-1deg); }
h1, h2 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-size: 32px; }
h2 { font-size: 24px; }
h3.sec { margin: 0 0 10px; font-size: 13px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); margin: 12px 0 0; max-width: 60ch; }
.ctx { background: var(--surface-2); border-radius: 8px; padding: 14px 16px; margin: 0 0 16px; max-width: 68ch; }
.ctx p { margin: 0 0 8px; }
.ctx p:last-child { margin: 0; }
.q { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 14px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--font-mono); font-weight: 600; width: 26px; height: 26px; border: 1.5px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .55; }

.fb { margin-top: 18px; border-radius: 8px; padding: 16px; border: 1.5px solid var(--line); background: var(--surface-2); }
.fb.ok { border-color: var(--good); background: var(--good-bg); }
.fb.ko { border-color: var(--bad); background: var(--bad-bg); }
.fb h3 { margin: 0 0 6px; font-size: 16px; }
.fb.ok h3 { color: var(--good); }
.fb.ko h3 { color: var(--bad); }
.fb p { margin: 0 0 10px; max-width: 66ch; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 12px 0; font-size: 15px; }
.rule .ref { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); border-color: var(--good); }
.chip.down { color: var(--bad); border-color: var(--bad); }
.btn { display: inline-block; margin-top: 16px; padding: 11px 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Formulaire d'ouverture */
.form { display: grid; gap: 12px; margin-top: 18px; max-width: 420px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input, .field select { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 0; }

/* Tri */
.sortcard { background: var(--surface-2); border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px 16px; margin: 0 0 14px; font-size: 18px; font-weight: 500; min-height: 78px; display: flex; align-items: center; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bucket { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; font-weight: 700; text-align: center; transition: border-color .15s, background .15s; }
.bucket:hover:not(:disabled) { border-color: var(--accent); }
.bucket:disabled { cursor: default; }
.bucket.right { border-color: var(--good); background: var(--good-bg); }
.bucket.wrong { border-color: var(--bad); background: var(--bad-bg); }
.bucket.dim { opacity: .55; }

/* Événement */
.event { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 16px; background: var(--surface-2); margin: 16px 0 0; }
.event b { display: block; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }

/* Fin et classement */
.score { font-family: var(--font-mono); font-size: 44px; font-weight: 600; letter-spacing: -0.02em; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.review { margin-top: 16px; display: grid; gap: 10px; }
.miss { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.miss b { display: block; margin-bottom: 4px; }
.miss .good-ans { color: var(--good); }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 14px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1.5px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
td.rk, th.rk { width: 36px; font-family: var(--font-mono); }
td.num, th.num { text-align: right; }
tr.me td { background: var(--good-bg); font-weight: 700; }
.nm { font-weight: 500; overflow-wrap: anywhere; }
.cls { color: var(--muted); font-size: 13px; }
.tag-row { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; margin: 7px 0; font-size: 14.5px; }
.tag-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.tag-bar > i { display: block; height: 100%; background: var(--bad); }
.code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
@media (max-width: 480px) {
  h1 { font-size: 27px; } h2 { font-size: 22px; } .card { padding: 16px; } .q { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div class="wrap">
  <p style="margin:12px 0 0;font-size:14px"><a href="../index.html" style="color:var(--accent)">Tous les jeux</a></p>
  <header class="top">
    <div class="top-row">
      <span class="brand">Le Franchisé</span>
      <span class="stage-label" id="stageLabel">Dossier de candidature</span>
    </div>
    <div class="meters">
      <div class="meter">
        <div class="meter-head"><span>Trésorerie</span><span class="meter-val cash" id="cashVal">60 k€</span></div>
        <div class="bar cash"><i id="cashBar" style="width:60%"></i></div>
      </div>
      <div class="meter">
        <div class="meter-head"><span>Sécurité juridique</span><span class="meter-val" id="secVal">50</span></div>
        <div class="bar"><i id="secBar" style="width:50%"></i></div>
      </div>
    </div>
    <div class="years" id="years" aria-label="Cinq années de franchise"></div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>

<script src="../js/config.js"></script>
<script src="../js/games.js"></script>
<script src="../js/scores.js"></script>
<script>window.MESJEUX_GAME="franchise";</script>
<script src="../js/access.js"></script>
<script>
(function () {
  "use strict";

  /* ================================================================== */
  /*  BANQUE DE QUESTIONS                                                */
  /*  Chaque partie tire au hasard dans son lot : deux parties ne se     */
  /*  ressemblent pas. Les réponses ne contiennent pas la définition ;   */
  /*  elle n'apparaît qu'après le choix.                                 */
  /* ================================================================== */
  var T3 = ["Liberté contractuelle", "Force obligatoire", "Bonne foi"];

  var P1 = [
    { id: "p1a", tag: "Contrat d'adhésion",
      ctx: ["L'enseigne vous remet son contrat : dix ans, droit d'entrée de 25 000 €, redevance de 6,5 % du chiffre d'affaires. Le conseiller précise que tous les franchisés signent le même texte, rédigé par l'enseigne."],
      q: "De quel type de contrat s'agit-il ?",
      opts: [
        { t: "Un contrat de gré à gré", ok: false, cost: 3, fb: "Un contrat de gré à gré a des clauses librement négociées. Ici le texte est le même pour tous : vous perdez trois semaines à batailler pour presque rien." },
        { t: "Un contrat d'adhésion", ok: true, fb: "Les clauses sont fixées à l'avance par une seule partie et proposées à tous : c'est un contrat d'adhésion. La marge de négociation est faible, la lecture attentive est votre vraie protection." },
        { t: "Un contrat verbal", ok: false, cost: 4, fb: "Le contrat est écrit, sur dix ans : la forme n'a rien à voir avec le type de contrat. Vous mélangez deux notions, coût 4 k€ de conseils inutiles." }
      ],
      rule: { ref: "Art. 1110 du Code civil", text: "Le contrat de gré à gré a des clauses négociées. Le contrat d'adhésion a des clauses fixées à l'avance par une seule des parties." } },
    { id: "p1b", tag: "Liberté contractuelle",
      ctx: ["Un second réseau, qui vous avait fait une proposition, menace de vous poursuivre parce que vous préférez Forno Express."],
      q: "Peut-il vous obliger à signer avec lui ?",
      opts: [
        { t: "Oui, puisque vous avez discuté avec lui", ok: false, cost: 4, fb: "Discuter n'engage pas. Vous aviez peur d'un procès qui n'existe pas : 4 k€ de frais d'avocat inutiles." },
        { t: "Non", ok: true, fb: "Vous êtes libre de contracter ou non, et avec qui : c'est la liberté contractuelle. Des pourparlers ne vous obligent pas à signer." },
        { t: "Oui, s'il vous a envoyé un mail", ok: false, cost: 3, fb: "Un mail d'un réseau ne vous oblige à rien tant que vous n'avez pas accepté. Vous cédez par crainte : 3 k€." }
      ],
      rule: { ref: "Liberté contractuelle", text: "Contracter ou non, avec qui, et le contenu du contrat : chacun en décide librement, dans le respect de la loi." } },
    { id: "p1c", tag: "Bonne foi",
      ctx: ["Pendant la négociation, le commercial vante votre zone sans mentionner que deux restaurants voisins ont fermé. Il le savait."],
      q: "Quel principe cette attitude méconnaît-elle ?",
      opts: [
        { t: "La liberté contractuelle", ok: false, cost: 4, fb: "Rien ne vous empêche de choisir : le problème est un manque de loyauté. Mauvais fondement, 4 k€ de frais." },
        { t: "La force obligatoire", ok: false, cost: 4, fb: "Le contrat n'est pas encore signé : il n'a donc pas de force obligatoire. Vous perdez 4 k€ à plaider sur le mauvais terrain." },
        { t: "La bonne foi", ok: true, fb: "La bonne foi est exigée dès la négociation. Celui qui détient une information déterminante pour l'autre doit la lui communiquer." }
      ],
      rule: { ref: "Art. 1104 du Code civil", text: "Les contrats doivent être négociés, formés et exécutés de bonne foi. Celui qui détient une information déterminante doit la communiquer." } },
    { id: "p1d", tag: "Force obligatoire",
      ctx: ["Le contrat est signé. Un an plus tard, l'enseigne annonce qu'elle fait passer seule la redevance de 6,5 % à 8 %."],
      q: "Quel principe contractuel s'y oppose ?",
      opts: [
        { t: "La bonne foi", ok: false, cost: 4, fb: "La bonne foi joue aussi, mais le principe central est autre : le contrat signé s'impose aux deux. Vous plaidez à côté, coût 4 k€." },
        { t: "La liberté contractuelle", ok: false, cost: 4, fb: "La liberté de contracter s'exerce avant la signature, pas pour changer seul un contrat conclu. Coût : 4 k€." },
        { t: "La force obligatoire", ok: true, fb: "Le contrat légalement formé tient lieu de loi à ceux qui l'ont conclu : on ne le modifie pas seul." }
      ],
      rule: { ref: "Art. 1103 du Code civil", text: "Les contrats légalement formés tiennent lieu de loi à ceux qui les ont faits." } },
    { id: "p1e", tag: "Forme du contrat",
      ctx: ["Un fournisseur de farine vous propose un accord oral : 100 sacs par mois à prix fixé. Vous hésitez, car rien n'est écrit."],
      q: "Un contrat peut-il être valable sans écrit ?",
      opts: [
        { t: "Non, jamais", ok: false, cost: 3, fb: "Un écrit n'est exigé que pour certains contrats. Vous perdez un bon fournisseur en refusant : 3 k€." },
        { t: "Oui, en principe", ok: true, fb: "Le contrat est en principe formé par le seul échange des consentements. Un écrit n'est exigé que pour certains contrats. L'écrit reste utile comme preuve." },
        { t: "Oui, mais seulement devant notaire", ok: false, cost: 3, fb: "Le notaire n'est exigé que pour des contrats précis, pas pour un accord de fourniture. Frais inutiles : 3 k€." }
      ],
      rule: { ref: "Forme du contrat", text: "Le contrat est en principe formé par le seul échange des consentements, même si certains contrats exigent un écrit." } }
  ];

  var S1 = { id: "s1", ctx: ["Trois principes encadrent tout contrat. Retrouvez celui qui correspond à chaque situation."], buckets: T3,
    items: [
      { t: "Vous refusez de signer avec un réseau concurrent.", b: 0, why: "Choisir de contracter ou non, et avec qui : liberté contractuelle." },
      { t: "Vous demandez la suppression d'une clause avant de signer.", b: 0, why: "Discuter le contenu du contrat relève de la liberté contractuelle." },
      { t: "L'enseigne doit respecter le prix fixé au contrat pendant dix ans.", b: 1, why: "Le contrat tient lieu de loi : force obligatoire." },
      { t: "Vous devez payer vos redevances même quand vos ventes baissent.", b: 1, why: "Le contrat s'impose à ceux qui l'ont conclu : force obligatoire." },
      { t: "Personne ne peut modifier le contrat seul après sa signature.", b: 1, why: "Modifier suppose l'accord des deux parties : force obligatoire." },
      { t: "L'enseigne vous communique loyalement les comptes de ses restaurants.", b: 2, why: "Loyauté et information dans la relation : bonne foi." },
      { t: "Pendant dix ans, aucune des parties ne cherche à nuire à l'autre.", b: 2, why: "La bonne foi est exigée de la négociation jusqu'à l'exécution." },
      { t: "Vous dissimulez volontairement vos difficultés financières à l'enseigne.", b: 2, why: "Dissimuler une information importante est contraire à la bonne foi." }
    ],
    rule: { ref: "Les trois principes", text: "Liberté contractuelle : contracter ou non, avec qui, et le contenu. Force obligatoire : le contrat tient lieu de loi. Bonne foi : négociation, formation et exécution." } };

  var P2 = [
    { id: "p2a", tag: "Pourparlers",
      ctx: ["Après deux mois de discussions, votre banque vous propose un projet moins risqué. Rien n'est signé avec Forno Express, qui vous a pourtant offert une formation d'essai d'une valeur de 10 k€."],
      q: "Vous renoncez. Que faites-vous ?",
      opts: [
        { t: "Je préviens l'enseigne par écrit, sans rien lui devoir", ok: true, fb: "Pendant les pourparlers chacun reste libre de ne pas conclure, à condition de ne pas rompre brutalement ni de mauvaise foi. Prévenir loyalement suffit : aucune dette." },
        { t: "Je préviens l'enseigne et je lui rembourse la formation par scrupule : 10 k€", ok: false, cost: 10, fb: "Honnête, mais inutile : rien n'obligeait à payer, la formation offerte ne crée aucune dette. Vous venez de dépenser 10 k€ pour rien." },
        { t: "Je ne réponds plus à ses appels : je gagne du temps et j'évite les frais d'un courrier d'avocat (+3 k€)", gain: 3, ok: false, back: "Rupture brutale des pourparlers : l'enseigne réclame des dommages-intérêts.", fb: "Vous économisez 3 k€ maintenant, mais couper les ponts sans prévenir est une rupture brutale, donc une faute. L'addition arrivera en fin d'année." }
      ],
      rule: { ref: "Les pourparlers", text: "Phase de négociation : chacun reste libre de ne pas conclure, mais ne doit pas rompre brutalement ni de mauvaise foi." } },
    { id: "p2b", tag: "DIP",
      ctx: ["L'enseigne vous remet le document d'information précontractuelle (DIP) le 3 mars. Elle souhaite une signature le 11 mars."],
      q: "Que devez-vous lui répondre ?",
      opts: [
        { t: "Le DIP doit être remis au moins 20 jours avant la signature", ok: true, fb: "En franchise, la loi impose la remise du DIP au moins 20 jours avant la signature. Ici il ne reste que 8 jours : la règle n'est pas respectée." },

  var LETTERS = ["A", "B", "C", "D"];

  /* « Prénom X. » : prénom + initiale du nom, jamais le nom complet */
  function cleanName(raw) {
    var t = String(raw).trim().replace(/\s+/g, " ");
    var m = t.match(/^(.{2,}?)\s+(\p{L})\.?$/u);
    if (!m) return null;
    return m[1].charAt(0).toUpperCase() + m[1].slice(1) + " " + m[2].toUpperCase() + ".";
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }

  /* Tirage d'une partie : lots tirés au hasard, ordre des cartes mélangé */
  function buildRun() {
    steps = []; totalAnswers = 0; var funDeck = shuffle(FUN);
    YEARS.forEach(function (y, yi) {
      steps.push({ kind: "year", yi: yi });
      var ys = [];   /* étapes de l'année : mélangées, mais l'année reste à sa place */
      y.plan.forEach(function (p) {
        if (p.fun) { ys.push({ kind: "choice", yi: yi, sc: funDeck.pop() }); }
        else if (p.pool) {
          shuffle(p.pool).slice(0, p.draw).forEach(function (sc) { ys.push({ kind: "choice", yi: yi, sc: sc }); totalAnswers++; });
        } else {
          var sc = p.sort;
          ys.push({ kind: "sort", yi: yi, sc: sc, items: shuffle(sc.items).slice(0, SORT_SIZE) });
          totalAnswers += SORT_SIZE;
        }
      });
      shuffle(ys).forEach(function (st) { steps.push(st); });
      steps.push({ kind: "event", yi: yi, ev: yi < YEARS.length - 1 ? EVENTS[Math.floor(Math.random() * EVENTS.length)] : null });
    });
    steps.push({ kind: "end" });
  }

    document.getElementById("secVal").textContent = Math.round(S ? S.sec : START_SEC);
    document.getElementById("secBar").style.width = clamp(S ? S.sec : START_SEC, 0, 100) + "%";
    var html = "";
    for (var k = 0; k < 5; k++) html += '<div class="yr ' + (yi < 0 ? "" : (k < yi ? "done" : (k === yi ? "now" : ""))) + '">An ' + (k + 1) + "</div>";
    if (yi === 5) html = html.replace(/yr "/g, 'yr done"');
    document.getElementById("years").innerHTML = html;
    document.getElementById("stageLabel").textContent = label || "Dossier de candidature";
  }

  function chips(ds, dc) {
    var out = "";
    if (ds) out += '<span class="chip ' + (ds > 0 ? "up" : "down") + '">Sécurité ' + (ds > 0 ? "+" : "−") + Math.abs(ds) + "</span>";
    if (dc) out += '<span class="chip ' + (dc > 0 ? "up" : "down") + '">Trésorerie ' + (dc > 0 ? "+" : "−") + Math.abs(dc) + " k€</span>";
    return out ? '<div class="chips">' + out + "</div>" : "";
  }
  function next() { S.i++; render(); }

  function render() {
    scrollTop();
    if (!S) return renderStart();
    var st = steps[S.i];
    if (st.kind === "year") return renderYear(st);
    if (st.kind === "choice") return renderChoice(st);
    if (st.kind === "sort") return renderSort(st);
    if (st.kind === "event") return renderEvent(st);
    return renderEnd();
  }

      var n = cleanName(document.getElementById("nm").value);
      var c = document.getElementById("cl").value;
      if (!n) { document.getElementById("err").textContent = "Entrez votre prénom suivi de l'initiale de votre nom, par exemple Camille D. (sans le nom complet)."; return; }
      if (!c) { document.getElementById("err").textContent = "Choisissez votre classe."; return; }
      lsSet("fr_name", n); lsSet("fr_cls", c);
      newGame(n, c);
      render();
    };
    document.getElementById("seeBoard").onclick = function () { renderBoardOnly(); };
  }

  /* ---------- Début d'année ---------- */
  function renderYear(st) {
    var y = YEARS[st.yi];
    renderHeader(st.yi, yearLabel(st.yi));
    var html = '<section class="card"><span class="tab">Année ' + (st.yi + 1) + ' sur 5</span><h2>' + esc(y.title) + '</h2><p class="lead">' + esc(y.intro(S.name)) + '</p><button class="btn" id="go">' + (st.yi === 0 ? "Commencer" : "Continuer") + "</button></section>";
    $main.innerHTML = html;
    document.getElementById("go").onclick = next;
  }

  /* ---------- Choix ---------- */
  function renderChoice(st) {
    var sc = st.sc;
    renderHeader(st.yi, yearLabel(st.yi));
    var opts = shuffle(sc.opts);
    var html = '<section class="card"><span class="tab">' + (sc.fun ? "Hors cours" : "Dossier") + " · Année " + (st.yi + 1) + "</span>" + ctxBox(sc.ctx) + '<p class="q">' + esc(sc.q) + '</p><div class="opts">';
    opts.forEach(function (o, k) { html += '<button class="opt" data-k="' + k + '"><span class="k">' + LETTERS[k] + "</span><span>" + esc(o.t) + "</span></button>"; });
    html += '</div><div id="fb"></div></section>';
    $main.innerHTML = html;
    var btns = $main.querySelectorAll(".opt");
    btns.forEach(function (b) {
      b.onclick = function () {
        var o = opts[+b.getAttribute("data-k")], ds, dc;
        if (sc.fun) { ds = 0; dc = o.c || 0; S.st.fun += dc; if (o.later && Math.random() < (o.later.p || 1)) S.pending.push({ t: o.later.t, c: o.later.c, k: "Conséquence de votre choix" }); }
        else {
          S.total++;
          if (o.ok) { S.good++; ds = 6; dc = -(o.pay || 0); S.st.pay += (o.pay || 0); if (o.pay) S.st.honest++; }
          else {
            ds = -10; dc = o.gain ? o.gain : -(o.cost || 4);
            if (o.gain) { S.st.tempt += o.gain; S.st.tcount++; } else S.st.err += (o.cost || 4);
            if (o.gain) S.pending.push({ t: o.back, c: -Math.round(o.gain * 1.5) });
            S.misses.push({ yi: st.yi, label: sc.q, ctx: sc.ctx[0], good: sc.opts.filter(function (x) { return x.ok; })[0].t, rule: sc.rule, tag: sc.tag });
          }
        }
        S.sec = clamp(S.sec + ds, 0, 100); S.cash += dc;
        btns.forEach(function (x, kk) { x.disabled = true; if (sc.fun) { if (x === b) x.classList.add("right"); else x.classList.add("dim"); } else if (opts[kk].ok) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
        renderHeader(st.yi, yearLabel(st.yi));
        var fb = document.getElementById("fb");
        fb.innerHTML = '<div class="fb ' + (sc.fun ? "" : (o.ok ? "ok" : "ko")) + '" role="status"><h3>' + (sc.fun ? "Juste pour le fun" : (o.ok ? "Bien vu" : "Mauvaise piste")) + "</h3><p>" + esc(o.fb) + "</p>" + (sc.fun ? '<p class="hint" style="margin:0">Votre choix aura peut-être des suites au bilan de fin d\'année.</p>' : ruleBox(sc.rule)) + chips(ds, dc) + '<button class="btn" id="nx">Continuer</button></div>';
        document.getElementById("nx").onclick = next;
        fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
      };
    });
  }

  /* ---------- Tri ---------- */
  function renderSort(st) {
    var sc = st.sc, items = st.items, idx = 0, right = 0;
    renderHeader(st.yi, yearLabel(st.yi));
    function show() {
      var it = items[idx];
      var html = '<section class="card"><span class="tab">Tri · Année ' + (st.yi + 1) + "</span>" + ctxBox(sc.ctx) +
        '<p class="count">Carte ' + (idx + 1) + " sur " + items.length + '</p><div class="sortcard">' + esc(it.t) + '</div><div class="buckets">';
      sc.buckets.forEach(function (b, k) { html += '<button class="bucket" data-k="' + k + '">' + esc(b) + "</button>"; });
      html += '</div><div id="fb"></div></section>';
      $main.innerHTML = html;
      var btns = $main.querySelectorAll(".bucket");
      btns.forEach(function (b) {
        b.onclick = function () {
          var k = +b.getAttribute("data-k"), ok = k === it.b, ds, dc = 0;
          S.total++;
          if (ok) { S.good++; right++; ds = 2; }
          else { ds = -3; dc = -1; S.st.err += 1; S.misses.push({ yi: st.yi, label: it.t, ctx: "", good: sc.buckets[it.b], rule: { ref: sc.rule.ref, text: it.why }, tag: sc.buckets[it.b] }); }
          S.sec = clamp(S.sec + ds, 0, 100); S.cash += dc;
          btns.forEach(function (x, kk) { x.disabled = true; if (kk === it.b) x.classList.add("right"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
          renderHeader(st.yi, yearLabel(st.yi));
          var last = idx === items.length - 1;
          var fb = document.getElementById("fb");
          var extra = last ? "<p><b>Tri terminé : " + right + " sur " + items.length + ".</b></p>" + ruleBox(sc.rule) : "";
          fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "ko") + '" role="status"><h3>' + (ok ? "Bien classé" : "Mauvaise case") + "</h3><p>" + esc(it.why) + "</p>" + extra + chips(ds, dc) + '<button class="btn" id="nx">' + (last ? "Continuer" : "Carte suivante") + "</button></div>";
          document.getElementById("nx").onclick = function () { if (last) next(); else { idx++; show(); } };
          fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
        };
      });
    }
    show();
  }

  /* ---------- Aléa de fin d'année ---------- */
  function renderEvent(st) {
    var back = S.pending.splice(0), bc = 0;
    if (st.ev) { S.cash += st.ev.c; S.st.ev += st.ev.c; }
    back.forEach(function (p) { bc += p.c; S.cash += p.c; if (p.k) S.st.fun += p.c; else S.st.back += p.c; });
    var last = st.yi === YEARS.length - 1;
    renderHeader(st.yi + 1, last ? "Bilan final" : "Fin de l'année " + (st.yi + 1));
    var html = '<section class="card"><span class="tab">Bilan de l\'année ' + (st.yi + 1) + "</span><h2>" + (last ? "Bilan de la cinquième année" : "Fin de l'année " + (st.yi + 1)) + '</h2><p class="lead">Trésorerie : ' + Math.round(S.cash) + ' k€. Sécurité juridique : ' + Math.round(S.sec) + '.</p>';
    if (st.ev) html += '<div class="event"><b>Imprévu</b>' + esc(st.ev.t) + "</div>" + chips(0, st.ev.c);
    back.forEach(function (p) { html += '<div class="event"><b>' + esc(p.k || "Retour de bâton") + '</b>' + esc(p.t) + "</div>" + chips(0, p.c); });
    html += '<button class="btn" id="go">' + (last ? "Voir le résultat" : "Année suivante") + "</button></section>";
    $main.innerHTML = html;
    document.getElementById("go").onclick = next;
  }

  /* ---------- Fin, classement ---------- */
  function pctScore() { return Math.round(100 * S.good / S.total); }
  function finalScore() { return Math.round(0.7 * pctScore() + 0.3 * 100 * clamp(S.cash, 0, 80) / 80); }
  function endingFor() {
    var p = pctScore();
    var d = p >= 75 ? "hi" : (p >= 50 ? "mid" : "lo");
    var a = S.cash <= 0 ? "broke" : (S.cash < 25 ? "tight" : (S.cash < 60 ? "ok" : "rich"));
    return ENDINGS[d + "/" + a];
  }
  function kfmt(v) { v = Math.round(v); return (v > 0 ? "+" : (v < 0 ? "−" : "")) + Math.abs(v) + " k€"; }
  function bilanHTML(pct) {
    var st = S.st, tags = {}, h = "";
    S.misses.forEach(function (m) { tags[m.tag] = (tags[m.tag] || 0) + 1; });
    var weak = Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a]; }).slice(0, 3);
    var lines = [
      ["Trésorerie de départ", START_CASH],
      ["Erreurs de droit (frais, sanctions)", -st.err],
      ["Choix honnêtes mais coûteux", -st.pay],
      ["Gains des tentations", st.tempt],
      ["Retours de bâton", st.back],
      ["Imprévus de fin d'année", st.ev],
      ["Scènes hors cours et leurs suites", st.fun]
    ];
    h += '<section class="card"><h3 class="sec">Bilan financier</h3><div class="tbl"><table><tbody>';
    lines.forEach(function (l, k) { h += "<tr><td>" + esc(l[0]) + '</td><td class="num">' + (k === 0 ? Math.round(l[1]) + " k€" : kfmt(l[1])) + "</td></tr>"; });
    h += '<tr><td><b>Trésorerie finale</b></td><td class="num"><b>' + Math.round(S.cash) + " k€</b></td></tr></tbody></table></div>";
    var p1 = "";
    if (st.tcount) p1 += "Vous avez cédé à " + st.tcount + " tentation" + (st.tcount > 1 ? "s" : "") + " : " + kfmt(st.tempt) + " au départ, puis " + kfmt(st.back) + " de retours de bâton. Le droit rattrape toujours ceux qui trichent avec le contrat. ";
    else p1 += "Vous n'avez cédé à aucune tentation : vos gains sont plus faibles, mais votre contrat est resté propre. ";
    if (st.honest) p1 += "Vous avez payé " + st.pay + " k€ pour rester honnête ou prudent : c'est le prix de la sécurité juridique. ";
    if (st.err > 10) p1 += "Vos erreurs de règle vous ont coûté " + st.err + " k€ : c'est la plus grosse fuite de votre caisse. ";
    if (st.ev < -8) p1 += "Les imprévus ont pesé " + kfmt(st.ev) + " : il aurait fallu des réserves plus solides.";
    else if (st.ev > 8) p1 += "Les imprévus vous ont plutôt aidé (" + kfmt(st.ev) + ") : une partie de votre réussite tient à la chance.";
    h += '<p style="margin:12px 0 0">' + esc(p1) + "</p></section>";
    h += '<section class="card"><h3 class="sec">Bilan juridique</h3><p style="margin:0 0 10px">' + esc(S.good + " bonnes réponses sur " + S.total + " (" + pct + " %), sécurité juridique " + Math.round(S.sec) + " sur 100.") + "</p>";
    if (!weak.length) h += '<p style="margin:0">Aucune erreur de règle : vous maîtrisez les notions de ce chapitre. Rejouez pour tomber sur d\'autres situations.</p>';
    else h += '<p style="margin:0">Notions à revoir en priorité : <b>' + weak.map(esc).join(", ") + "</b>. Retrouvez le détail dans la fiche en bas de page.</p>";
    return h + "</section>";
  }

  function renderEnd() {
    renderHeader(5, "Dossier clôturé");
    var end = endingFor(), pct = pctScore(), final = finalScore();
    var code = "FRANCHISE | " + S.name + (S.cls ? " | " + S.cls : "") + " | " + S.good + "/" + S.total + " | " + Math.round(S.cash) + " k€ | note " + finalScore() + " | " + new Date().toLocaleDateString("fr-FR");
    var html = '<section class="card"><span class="tab">Fin du dossier</span><h2>' + esc(end.title) + '</h2><div class="score">' + final + ' / 100</div>' + end.text.map(function (t) { return '<p class="lead">' + esc(t) + "</p>"; }).join("") +
      '<p class="hint" style="margin-top:12px">' + esc(S.name) + " · " + pct + " % de bonnes réponses (70 % de la note) · trésorerie finale <b>" + Math.round(S.cash) + " k€</b> (30 % de la note, plafonnée à 80 k€)</p>" +
      '<div class="row"><button class="btn" id="again">Rejouer</button></div></section>';
    html += bilanHTML(pct);
    html += '<section class="card"><h3 class="sec">Classement</h3><div id="board"><p class="hint" style="margin:0">Chargement du classement…</p></div></section>';
    html += '<section class="card"><h3 class="sec">Notions les plus ratées</h3><div id="tags"><p class="hint" style="margin:0">Chargement…</p></div></section>';
    html += '<section class="card"><h3 class="sec">Votre code de résultat</h3><p class="hint" style="margin:0 0 10px">À garder si le classement est indisponible.</p><div class="code" id="code">' + esc(code) + '</div><div class="row"><button class="btn ghost" id="copy" style="margin-top:12px">Copier le code</button></div></section>';
    html += '<section class="review" aria-label="Fiche à revoir"><div class="card"><h3 class="sec">Fiche à revoir (' + S.misses.length + ")</h3>";
    if (!S.misses.length) html += '<p style="margin:0">Aucune erreur. Rejouez pour tomber sur d\'autres situations.</p>';
    else {
      var lastY = -1;
      S.misses.slice().sort(function (a, b) { return a.yi - b.yi; }).forEach(function (m) {
        if (m.yi !== lastY) { html += '<h3 class="sec" style="margin-top:14px">' + esc(yearLabel(m.yi)) + "</h3>"; lastY = m.yi; }
        html += '<div class="miss" style="margin-bottom:8px"><b>' + esc(m.label) + '</b><span class="good-ans">Bonne réponse : ' + esc(m.good) + "</span><br><span>" + esc(m.rule.ref) + " : " + esc(m.rule.text) + "</span></div>";
      });
    }
    html += "</div></section>";
    $main.innerHTML = html;
    document.getElementById("again").onclick = function () { if (boardUnsub) { boardUnsub(); boardUnsub = null; } S = null; render(); };
    document.getElementById("copy").onclick = function () {
      var el = document.getElementById("code"), btn = this;
      function sel() { try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* sélection indisponible */ } }
      var done = function () { btn.textContent = "Code copié"; };
      try { navigator.clipboard.writeText(code).then(done, sel); } catch (e) { sel(); }
    };
    saveAndShowBoard({
      name: S.name, cls: S.cls, score: pct, final: final, good: S.good, total: S.total, cash: Math.round(S.cash), sec: Math.round(S.sec),
      ending: end.title, ts: Date.now(), secs: Math.round((Date.now() - S.t0) / 1000),
      tags: S.misses.map(function (m) { return m.tag; })
    });
  }

  function renderBoardOnly() {
    renderHeader(-1, "Classement");
    $main.innerHTML = '<section class="card"><h3 class="sec">Classement</h3><div id="board"><p class="hint" style="margin:0">Chargement du classement…</p></div></section>' +
      '<section class="card"><h3 class="sec">Notions les plus ratées</h3><div id="tags"><p class="hint" style="margin:0">Chargement…</p></div></section>' +
      '<div class="row"><button class="btn ghost" id="back">Retour</button></div>';
    document.getElementById("back").onclick = function () { if (boardUnsub) { boardUnsub(); boardUnsub = null; } render(); };
    saveAndShowBoard(null);
  }

  /* Enregistrement automatique du résultat, puis classement partagé (Supabase).
     Chaque partie jouée ajoute une ligne au classement. */
  var boardRows = [], boardMe = "", boardState = "none", boardClass = "";

  function saveAndShowBoard(row) {
    var boardEl = function () { return document.getElementById("board"); };
    var tagsEl = function () { return document.getElementById("tags"); };
    var unavailable = function (msg) {
      if (boardEl()) boardEl().innerHTML = '<p class="hint" style="margin:0">' + esc(msg) + "</p>";
      if (tagsEl()) tagsEl().innerHTML = '<p class="hint" style="margin:0">Disponible avec le classement.</p>';
    };
    if (!(window.MesJeux && MesJeux.ready())) { unavailable("Le classement n'est pas encore branché. Utilisez le code de résultat."); return; }
    if (boardUnsub) { boardUnsub(); boardUnsub = null; }
    boardClass = row ? (row.cls || "") : lsGet("fr_cls");
    boardMe = row ? row.name : lsGet("fr_name");

    function toRow(r) {
      var d = r.details || {};
      return { name: r.player, cls: d.cls || "", score: d.score, final: r.score, good: d.good, total: d.total, cash: d.cash, sec: d.sec, tags: d.tags || [], ts: Date.parse(r.created_at) || 0 };
    }
    function refresh() {
      return MesJeux.list("franchise", 1000).then(function (rows) { boardRows = rows.map(toRow); redraw(); },
        function () { unavailable("Le classement n'a pas pu être lu. Utilisez le code de résultat."); });
    }

    var saveP = Promise.resolve("none");
    if (row) saveP = MesJeux.save("franchise", row.name, row.final, row).then(function (r) { return r.ok ? "saved" : "readonly"; });
    saveP.then(function (state) {
      boardState = state;
      refresh().then(function () {
        var id = setInterval(function () { if (!boardEl()) { clearInterval(id); return; } refresh(); }, 30000);
        boardUnsub = function () { clearInterval(id); };
      });
    });
  }

  function redraw() {
    var rows = boardClass ? boardRows.filter(function (r) { return r.cls === boardClass; }) : boardRows;
    drawBoard(rows, boardMe, boardState);
    drawTags(rows);
  }

  function classPicker() {
    var o = '<option value="">Toutes les classes</option>' + CLASSES.map(function (c) { return '<option' + (c === boardClass ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
    return '<div class="field" style="max-width:260px;margin:0 0 12px"><label for="bc">Classement de la classe</label><select id="bc">' + o + "</select></div>";
  }
  function bindPicker() { var p = document.getElementById("bc"); if (p) p.onchange = function () { boardClass = this.value; redraw(); }; }

  function drawBoard(rows, me, state) {
    var el = document.getElementById("board"); if (!el) return;
    rows = rows.slice().sort(function (a, b) { return ((b.final != null ? b.final : b.score) - (a.final != null ? a.final : a.score)) || (b.cash - a.cash) || (a.ts - b.ts); });
    var note = "";
    if (state === "readonly") note = '<p class="hint" style="margin:0 0 10px">Votre résultat n\'a pas pu être enregistré (connexion indisponible). Il sera renvoyé à la prochaine ouverture du jeu. Gardez le code de résultat.</p>';
    if (!rows.length) { el.innerHTML = classPicker() + note + '<p class="hint" style="margin:0">Aucun résultat pour l\'instant. Le premier à finir ouvre le classement.</p>'; bindPicker(); return; }
    var meTs = Math.max.apply(null, rows.filter(function (r) { return r.name === me; }).map(function (r) { return r.ts; }).concat([0]));
    var h = classPicker() + note + '<div class="tbl"><table><thead><tr><th class="rk">#</th><th>Joueur</th><th class="num">Droit</th><th class="num">Trés.</th><th class="num">Note</th></tr></thead><tbody>';
    rows.slice(0, 30).forEach(function (r, i) {
      h += '<tr class="' + (r.name === me && r.ts === meTs ? "me" : "") + '"><td class="rk">' + (i + 1) + '</td><td><span class="nm">' + esc(r.name || "?") + "</span>" + (r.cls ? ' <span class="cls">' + esc(r.cls) + "</span>" : "") + '</td><td class="num">' + esc(r.good) + "/" + esc(r.total) + ' <span class="cls">(' + esc(r.score) + ' %)</span></td><td class="num">' + esc(r.cash) + " k€</td><td class=\"num\"><b>" + esc(r.final != null ? r.final : r.score) + "</b></td></tr>";
    });
    h += "</tbody></table></div><p class=\"hint\" style=\"margin:10px 0 0\">" + rows.length + " partie" + (rows.length > 1 ? "s" : "") + ". Chaque partie jouée est ajoutée au classement.</p>";
    el.innerHTML = h; bindPicker();
  }

  function drawTags(rows) {
    var el = document.getElementById("tags"); if (!el) return;
    var count = {};
    rows.forEach(function (r) { (r.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; }); });
    var arr = Object.keys(count).map(function (k) { return [k, count[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
    if (!arr.length) { el.innerHTML = '<p class="hint" style="margin:0">Pas encore assez de résultats.</p>'; return; }
    var max = arr[0][1], h = "";
    arr.forEach(function (a) { h += '<div class="tag-row"><span>' + esc(a[0]) + '</span><span class="tag-bar" title="' + a[1] + ' erreurs"><i style="width:' + Math.round(100 * a[1] / max) + '%"></i></span></div>'; });
    el.innerHTML = h + '<p class="hint" style="margin:8px 0 0">Calculé sur toutes les parties de la classe sélectionnée.</p>';
  }

  render();
})();
</script>

</body></html>
