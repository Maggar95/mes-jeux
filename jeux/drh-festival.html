<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le DRH du Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Concept : une affiche de festival. Nuit violette, néons rose / jaune / cyan. */
:root {
  --bg: #120b24; --surface: #1f1440; --surface-2: #2a1c52; --ink: #f6f1ff; --muted: #b9acdc; --line: #43326f;
  --pink: #ff3d81; --yellow: #ffd23f; --cyan: #38e8ee;
  --good: #3ddc97; --good-bg: #0f3a2c; --bad: #ff7a7a; --bad-bg: #40151f;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-title: "Bungee", "Arial Black", Impact, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font: 16px/1.5 var(--font-body);
  background:
    radial-gradient(900px 520px at 90% -10%, rgba(255, 61, 129, .24), transparent 60%),
    radial-gradient(700px 520px at -10% 8%, rgba(56, 232, 238, .15), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  padding: 0 max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 700px; margin: 0 auto; }
.back { margin: 12px 0 0; font-size: 14px; }
.back a { color: var(--cyan); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

/* En-tête : les trois jauges et le score */
.top { position: sticky; top: 0; z-index: 9; margin-top: 8px; padding: 10px 0 10px; background: rgba(18, 11, 36, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--font-title); font-size: 15px; letter-spacing: .02em; color: var(--yellow); }
.score { font-family: var(--font-title); font-size: 17px; color: var(--cyan); font-variant-numeric: tabular-nums; }
.score small { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-right: 6px; }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; color: var(--muted); }
.meter-val { font-variant-numeric: tabular-nums; color: var(--ink); }
.bar { height: 9px; border-radius: 5px; background: var(--surface-2); margin-top: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: 5px; transition: width .5s ease; }
.m-cash > i { background: var(--yellow); }
.m-mood > i { background: var(--pink); }
.m-law > i { background: var(--cyan); }
.meter.low .bar { border-color: var(--bad); }
.meter.low .meter-val { color: var(--bad); }
.eds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 9px; }
.ed { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ed .dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 3px; }
.ed .dots i { height: 4px; border-radius: 2px; background: var(--line); }
.ed .dots i.done { background: var(--ink); }
.ed .dots i.now { background: var(--pink); }
.ed.now { color: var(--ink); }

/* Cartes */
main { padding-top: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.card + .card { margin-top: 16px; }
.band { margin: 0 0 16px; padding: 14px 16px; border-radius: 14px; background: linear-gradient(100deg, var(--pink), #ff7a3d); color: #1a0a2e; }
.band b { display: block; font-family: var(--font-title); font-size: 21px; line-height: 1.15; }
.band span { display: block; font-size: 13.5px; font-weight: 700; margin-top: 4px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--cyan); border: 1.5px solid var(--cyan); border-radius: 5px; padding: 2px 8px; margin: 0 0 12px; transform: rotate(-1deg); }
h1, h2 { margin: 0; font-family: var(--font-title); font-weight: 400; line-height: 1.12; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 34px; color: var(--yellow); }
h2 { font-size: 24px; color: var(--yellow); }
h3.sec { margin: 0 0 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lead { color: var(--muted); margin: 12px 0 0; max-width: 62ch; }
.hint { color: var(--muted); font-size: 14px; }
.place { margin: 0 0 12px; padding: 10px 12px; border-left: 4px solid #ffd23f; background: rgba(255,210,63,.12); border-radius: 0 8px 8px 0; line-height: 1.5; }
.who { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.av { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 25px; background: var(--surface-2); border: 2px solid var(--pink); }
.who b { display: block; line-height: 1.2; }
.who i { display: block; font-style: normal; font-size: 13px; color: var(--muted); }
.ctx { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; max-width: 68ch; }
.ctx p { margin: 0 0 8px; }
.ctx p:last-child { margin: 0; }
.q { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0 0 14px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--pink); }
.opt:disabled { cursor: default; }
.opt .k { font-weight: 700; width: 26px; height: 26px; border: 1.5px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.opt.sel { border-color: var(--yellow); background: var(--surface-2); }
.opt.sel .k { background: var(--yellow); border-color: var(--yellow); color: #1a0a2e; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); border-color: var(--good); color: #0b2a20; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #2a0b10; }
.opt.dim { opacity: .5; }
.opt small { display: block; color: var(--muted); font-size: 13px; }
.fb { margin-top: 18px; border-radius: 10px; padding: 16px; border: 1.5px solid var(--line); background: var(--surface-2); }
.fb.ok { border-color: var(--good); background: var(--good-bg); }
.fb.ko { border-color: var(--bad); background: var(--bad-bg); }
.fb h3 { margin: 0 0 6px; font-size: 16px; }
.fb.ok h3 { color: var(--good); }
.fb.ko h3 { color: var(--bad); }
.fb p { margin: 0 0 10px; max-width: 66ch; }
.fb ul { margin: 0 0 10px; padding-left: 20px; }
.rule { background: var(--surface); border: 1px dashed var(--yellow); border-radius: 8px; padding: 10px 12px; margin: 12px 0 0; font-size: 14.5px; }
.rule .ref { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); margin-bottom: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); border-color: var(--good); }
.chip.down { color: var(--bad); border-color: var(--bad); }
.btn { display: inline-block; margin-top: 16px; padding: 11px 22px; border-radius: 10px; border: 0; background: var(--pink); color: #1a0a2e; font-weight: 700; }
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Formulaire */
.form { display: grid; gap: 12px; margin-top: 18px; max-width: 420px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 0; }
.rules { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.rules li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 15px; }

/* Profil de poste */
.crit { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.crit:first-of-type { border-top: 0; }
.crit b { display: block; }
.crit small { color: var(--muted); }
.step { display: inline-flex; align-items: center; gap: 8px; }
.step button { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 18px; line-height: 1; }
.step button:hover:not(:disabled) { border-color: var(--pink); }
.step button:disabled { opacity: .35; cursor: default; }
.step output { min-width: 108px; text-align: center; font-size: 13.5px; font-weight: 700; }
.pts-left { font-weight: 700; margin: 0 0 6px; }
.pts-left span { color: var(--yellow); font-size: 20px; font-family: var(--font-title); }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 0; }
.cmp th, .cmp td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
.cmp th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cmp td.num, .cmp th.num { text-align: center; }
.cmp .okc { color: var(--good); font-weight: 700; }
.cmp .koc { color: var(--bad); font-weight: 700; }

/* Tri */
.sortcard { background: var(--surface-2); border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px 16px; margin: 0 0 14px; font-size: 18px; font-weight: 500; min-height: 78px; display: flex; align-items: center; }
.count { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.bucket { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; font-weight: 700; text-align: center; }
.bucket:hover:not(:disabled) { border-color: var(--pink); }
.bucket:disabled { cursor: default; }
.bucket.right { border-color: var(--good); background: var(--good-bg); }
.bucket.wrong { border-color: var(--bad); background: var(--bad-bg); }
.bucket.dim { opacity: .5; }

/* Événement */
.event { border: 1.5px dashed var(--cyan); border-radius: 12px; padding: 16px; background: var(--surface-2); }
.event b { display: block; font-family: var(--font-title); font-size: 18px; color: var(--cyan); font-weight: 400; margin-bottom: 6px; }

/* Fin */
.bigscore { font-family: var(--font-title); font-size: 52px; color: var(--cyan); margin: 8px 0 0; font-variant-numeric: tabular-nums; line-height: 1; }
.endtitle { font-family: var(--font-title); font-size: 28px; line-height: 1.12; color: var(--yellow); margin: 6px 0 0; }
.mast { display: grid; grid-template-columns: 150px 1fr 56px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14.5px; }
.mast .bar { margin: 0; }
.mast .bar > i { background: var(--good); }
.mast.low .bar > i { background: var(--bad); }
.mast span:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.review { margin-top: 12px; display: grid; gap: 10px; }
.miss { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.miss b { display: block; margin-bottom: 2px; color: var(--yellow); }
.tbl { overflow-x: auto; }
table.board { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.board th, .board td { padding: 8px 8px; border-top: 1px solid var(--line); text-align: left; }
.board th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 0; }
.board .num { text-align: right; font-variant-numeric: tabular-nums; }
.board .rk { width: 32px; color: var(--muted); }
.board tr.me td { background: rgba(255, 210, 63, .12); }
.board .cls { color: var(--muted); font-size: 12.5px; }
.tag-row { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; margin: 7px 0; font-size: 14.5px; }
.tag-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.tag-bar > i { display: block; height: 100%; background: var(--bad); }

@media (max-width: 520px) {
  h1 { font-size: 27px; } h2 { font-size: 21px; } .card { padding: 16px; } .q { font-size: 18px; }
  .meters { gap: 8px; } .meter-head { font-size: 11px; } .mast { grid-template-columns: 110px 1fr 52px; }
  .step output { min-width: 84px; font-size: 12.5px; } .endtitle { font-size: 23px; } .bigscore { font-size: 42px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.mini { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
.mcanvas { width: 100%; max-width: 420px; aspect-ratio: 8 / 5; border-radius: 8px; border: 2px solid var(--line); touch-action: none; display: block; margin: 0 auto; background: #120b24; cursor: none; }
.mstat { margin: 8px 0; font-weight: 700; color: var(--yellow); }
.stopbar { position: relative; height: 34px; border-radius: 8px; background: var(--bg); border: 2px solid var(--line); overflow: hidden; margin: 10px auto; max-width: 420px; }
.stopbar .zone { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .85; }
.stopbar .mark { position: absolute; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: var(--pink); border-radius: 4px; }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 320px; margin: 10px auto 0; }
.pad { height: 76px; border-radius: 12px; border: 3px solid transparent; font-weight: 700; color: #1a0a2e; opacity: .55; transition: opacity .1s, transform .1s; }
.pad.p0 { background: var(--cyan); } .pad.p1 { background: var(--pink); } .pad.p2 { background: var(--yellow); } .pad.p3 { background: var(--good); }
.pad.on { opacity: 1; transform: scale(1.05); border-color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <p class="back"><a href="../index.html">Tous les jeux</a></p>
  <header class="top">
    <div class="top-row">
      <span class="brand">Le DRH du Festival</span>
      <span class="score"><small>Score</small><span id="scoreVal">0</span></span>
    </div>
    <div class="meters">
      <div class="meter m-cash" id="mCash"><div class="meter-head"><span>Trésorerie</span><span class="meter-val" id="cashVal">60</span></div><div class="bar"><i id="cashBar" style="width:60%"></i></div></div>
      <div class="meter m-mood" id="mMood"><div class="meter-head"><span>Ambiance</span><span class="meter-val" id="moodVal">60</span></div><div class="bar"><i id="moodBar" style="width:60%"></i></div></div>
      <div class="meter m-law" id="mLaw"><div class="meter-head"><span>Conformité</span><span class="meter-val" id="lawVal">60</span></div><div class="bar"><i id="lawBar" style="width:60%"></i></div></div>
    </div>
    <div class="eds" id="eds" aria-label="Progression sur trois éditions"></div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>

<script src="../js/config.js"></script>
<script src="../js/games.js"></script>
<script src="../js/scores.js"></script>
<script>window.MESJEUX_GAME = "drh-festival";</script>
<script src="../js/access.js"></script>
<script>
(function () {
  "use strict";

  /* ================================================================== */
  /*  PERSONNAGES                                                        */
  /* ================================================================== */
  var W = {
    T: { n: "M. Tambour", e: "🥁", r: "Directeur du festival, ex-batteur" },
    G: { n: "Gérard", e: "🧮", r: "Directeur financier, ennemi du café" },
    K: { n: "Kévin", e: "📱", r: "Stagiaire communication" },
    P: { n: "Mme Pérignon", e: "✊", r: "Déléguée du personnel" },
    L: { n: "Luigi", e: "🍕", r: "Chef des bars, roi de la cooptation" },
    B: { n: "Inspectrice Bertoli", e: "🕵️", r: "Inspection du travail" },
    N: { n: "Nadia", e: "🎟️", r: "Responsable accueil et billetterie" },
    Th: { n: "Théo", e: "🎚️", r: "Technicien son" },
    I: { n: "Inès", e: "💡", r: "Régisseuse lumière" },
    Le: { n: "Léa", e: "📣", r: "Ambassadrice indépendante" },
    Ka: { n: "Karim B.", e: "🦺", r: "Candidat, responsable sécurité" },
    D: { n: "Dylan", e: "🕶️", r: "Ambassadeur indépendant" },
    S: { n: "Serge", e: "📦", r: "Magasinier, 22 ans de maison" },
    M: { n: "Michel", e: "🎮", r: "Responsable de l'appli mobile, parieur compulsif" }
  };

  /* ================================================================== */
  /*  LES TROIS ÉDITIONS                                                 */
  /*  ch : 1 = besoin en recrutement, 2 = relations de travail,          */
  /*       3 = évaluation. d = [trésorerie, ambiance, conformité].       */
  /* ================================================================== */
  var EDITIONS = [

    /* ---------------------------------------------------------------- */
    /*  ÉDITION 1                                                        */
    /* ---------------------------------------------------------------- */
    {
      title: "Édition 1 · Premiers pas",
      intro: [
        "Bienvenue au Décibel Festival : trois jours, 25 000 festivaliers, 40 permanents, 300 saisonniers et un directeur, M. Tambour, qui prend encore les frigos pour des grosses caisses.",
        "Tu es son nouveau DRH. Ta mission : que la boîte tourne trois éditions de suite. Chaque décision fait bouger la trésorerie, l'ambiance et la conformité au droit. Si l'une des trois tombe à zéro, c'est la fin du concert."
      ],
      quarters: [
        { label: "T1 · Hiver", chap: "Le besoin en recrutement",
          blurb: "Le festival est enneigé, Gérard a éteint le chauffage « pour la cause ». Un poste clé se libère.",
          scenes: [
            { ty: "choice", ch: 1, tag: "Anticiper les besoins", who: "T",
              ctx: ["Tambour déroule un tableau sur ton bureau : quatre départs en retraite d'ici deux ans (régie, sécurité, bars, comptabilité), la billetterie qui passe au tout-numérique, et un festival qui veut grandir. Gilbert, le régisseur général, part dans six mois.",
                    "« Comment on s'y prend pour ne pas se retrouver le bec dans l'eau ? »"],
              q: "Que mets-tu en place ?",
              opts: [
                { t: "Un plan de GPEC : anticiper les départs et l'évolution des métiers, puis former et organiser les mobilités", d: [-2, 4, 2], pts: 50, ok: true,
                  fb: "La GPEC (gestion prévisionnelle des emplois et des compétences) permet d'anticiper les conséquences de l'environnement et de la stratégie sur les emplois, puis de définir des actions à court et moyen terme. Gilbert est le premier dossier de la liste." },
                { t: "On verra quand chacun partira : on recrutera au dernier moment", d: [-6, -4, 0], pts: -15, ok: false,
                  fb: "Recruter en urgence coûte plus cher, et tout le savoir-faire de Gilbert part avec lui, sans transmission. Tambour « se souvient » alors qu'il a déjà vécu ça avec le régisseur lumière." },
                { t: "Embaucher dix personnes dès maintenant, à tout hasard", d: [-10, 0, 0], pts: -10, ok: false,
                  fb: "Anticiper ne veut pas dire recruter sans savoir quoi ni qui. Gérard demande à voir la liste des postes. Elle n'existe pas." }
              ],
              rule: { ref: "La GPEC", text: "Un plan de GPEC permet à l'entreprise d'anticiper les conséquences de son environnement interne et externe et de ses choix stratégiques, afin de définir les actions à mener à court et moyen terme : développer la qualification des salariés, valoriser les compétences, accompagner les changements d'organisation et développer les mobilités professionnelles." } },

            { ty: "profile", ch: 1, tag: "Profil de poste", who: "T",
              ctx: ["Premier départ à préparer : Gilbert, notre régisseur général, part à la retraite dans six mois. Dix-huit ans à monter des scènes sous la pluie.",
                    "Définition de poste. Le régisseur général pilote la production technique des trois jours : il coordonne le montage et le démontage de quatre scènes avec les prestataires et dirige une soixantaine de techniciens. Il est responsable de la sécurité du site (plans d'évacuation, relations avec les pompiers et la préfecture). Il règle les imprévus en direct : orage, panne, artiste en retard. Il travaille avec les équipes des artistes, les fournisseurs et les bénévoles.",
                    "À toi de bâtir le profil de poste, le portrait idéal du candidat, à partir de ces missions. Chaque critère se note de 1 (souhaitable) à 3 (indispensable). Tu disposes de 14 points à répartir, pas un de plus : tout ne pourra pas être « indispensable ».",
                    "Gérard : « Mets 3 partout, ça ne coûte rien ! » (Il se trompe.)"],
              q: "Comment pondères-tu les critères ?", budget: 14,
              crit: [
                { n: "Niveau de qualification", sub: "Diplôme demandé", ideal: 1, w: 1 },
                { n: "Expérience", sub: "Années sur des postes comparables", ideal: 2, w: 2 },
                { n: "Connaissance du spectacle vivant", sub: "Scènes, artistes, contraintes techniques", ideal: 2, w: 2 },

  MINI.pong = function (box, done) {
    var W2 = 320, H2 = 200, PH = 46, PW = 7;
    box.innerHTML = '<canvas class="mcanvas" width="' + W2 + '" height="' + H2 + '" aria-label="Terrain de Pong"></canvas><p class="mstat" id="mstat" aria-live="off">Temps : 0,0 s / 12</p>';
    var cv = box.querySelector("canvas"), ctx = cv.getContext("2d");
    var m = { py: H2 / 2, bx: W2 / 2, by: H2 / 2, vx: 150, vy: 95, t: 0 };
    S.mini = m;
    var last = 0, raf = 0, fin = false, keys = {};
    function setY(clientY) { var r = cv.getBoundingClientRect(); m.py = clamp((clientY - r.top) * (H2 / r.height), PH / 2, H2 - PH / 2); }
    cv.addEventListener("pointermove", function (e) { setY(e.clientY); });
    cv.addEventListener("pointerdown", function (e) { setY(e.clientY); });
    function kd(e) { if (e.key === "ArrowUp" || e.key === "ArrowDown") { keys[e.key] = true; e.preventDefault(); } }
    function ku(e) { if (e.key === "ArrowUp" || e.key === "ArrowDown") keys[e.key] = false; }
    document.addEventListener("keydown", kd); document.addEventListener("keyup", ku);
    function draw() {
      ctx.fillStyle = "#120b24"; ctx.fillRect(0, 0, W2, H2);
      ctx.strokeStyle = "#43326f"; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(W2 / 2, 0); ctx.lineTo(W2 / 2, H2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#ffd23f"; ctx.fillRect(8, m.py - PH / 2, PW, PH);
      ctx.fillStyle = "#ff3d81"; ctx.beginPath(); ctx.arc(m.bx, m.by, 6, 0, Math.PI * 2); ctx.fill();
    }
    function end(win) { if (fin) return; fin = true; cancelAnimationFrame(raf); done(win); }
    function tick(ts) {
      if (fin) return;
      var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
      if (keys.ArrowUp) m.py = clamp(m.py - 260 * dt, PH / 2, H2 - PH / 2);
      if (keys.ArrowDown) m.py = clamp(m.py + 260 * dt, PH / 2, H2 - PH / 2);
      m.t += dt; m.bx += m.vx * dt; m.by += m.vy * dt;
      if (m.by < 6) { m.by = 6; m.vy = Math.abs(m.vy); }
      if (m.by > H2 - 6) { m.by = H2 - 6; m.vy = -Math.abs(m.vy); }
      if (m.bx > W2 - 6) { m.bx = W2 - 6; m.vx = -Math.abs(m.vx); }
      if (m.vx < 0 && m.bx <= 8 + PW + 6) {
        if (Math.abs(m.by - m.py) <= PH / 2 + 5) { m.bx = 8 + PW + 6; m.vx = Math.abs(m.vx) * 1.07; m.vy += (m.by - m.py) * 2.2; m.vy = clamp(m.vy, -220, 220); }
        else if (m.bx < 0) { draw(); return end(false); }
      }
      draw();
      var s = document.getElementById("mstat"); if (s) s.textContent = "Temps : " + Math.min(12, m.t).toFixed(1).replace(".", ",") + " s / 12";
      if (m.t >= 12) return end(true);
      raf = requestAnimationFrame(tick);
    }
    draw(); raf = requestAnimationFrame(tick);
    return function () { fin = true; cancelAnimationFrame(raf); document.removeEventListener("keydown", kd); document.removeEventListener("keyup", ku); };
  };

  MINI.stop = function (box, done) {
    var ZW = [0.30, 0.22, 0.16], SP = [0.9, 1.25, 1.6], round = 0, hits = 0, pos = 0, dir = 1, last = 0, raf = 0, fin = false, lock = false, zone = [0, 0];
    box.innerHTML = '<p class="mstat" id="mstat">Essai 1 / 3</p><div class="stopbar" id="sbar"><i class="zone" id="szone"></i><i class="mark" id="smark"></i></div><div id="smsg" class="mstat" style="min-height:24px"></div><button class="btn" id="sstop" style="margin-top:6px">STOP !</button>';

    var m = { get pos() { return pos; }, get zone() { return zone; }, get hits() { return hits; }, get round() { return round; } };

    function end(win) { if (fin) return; fin = true; cancelAnimationFrame(raf); done(win); }

    return function () { fin = true; cancelAnimationFrame(raf); };
  };

  MINI.simon = function (box, done) {
    var NOTES = [["Do", 262], ["Mi", 330], ["Sol", 392], ["Do aigu", 523]], N = 6, seq = [], round = 0, idx = 0, busy = true, fin = false, timers = [], ac = null;

    function later(f, ms) { timers.push(setTimeout(f, ms)); }
    function beep(i) {
      try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = NOTES[i][1]; o.type = "triangle"; g.gain.value = 0.12; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.22); } catch (e) { /* pas de son */ }
    }

    function play() {

        idx++;

  };

      var bet = document.getElementById("bet");
      bet.innerHTML = '<p class="hint" style="margin:0 0 10px">' + esc(B.rule) + '</p><div class="mini" id="mbox"></div>';
      Array.prototype.forEach.call($main.querySelectorAll(".ctx, .q"), function (e) { e.style.display = "none"; });
      S.cleanup = MINI[sc.g](document.getElementById("mbox"), function (win) { result(win, false); });
      scrollTop();
    };
  }


  /* ---------- Bilan de fin d'édition ---------- */
  function renderVerdict(st) {
    var ei = st.ei, bonus = 0, ed = EDITIONS[ei];
    if (!S.verdictDone[ei]) {
      bonus = Math.round(((S.cash + S.mood + S.law) / 3 - 50) * 2);
      S.score = Math.max(0, S.score + bonus); S.verdictDone[ei] = { bonus: bonus };
      renderHeader();
    } else bonus = S.verdictDone[ei].bonus;
    var pct = maxSeen() ? S.score / maxSeen() : 0, last = ei === EDITIONS.length - 1;
    var fired = !last && pct < LIMITS[ei];
    if (fired) S.over = "fired";
    var msg = fired ? "Le conseil estime que ton bilan est insuffisant. Il ne te reconduit pas."
      : (pct >= 0.65 ? "Le conseil applaudit. Tambour verse une petite larme dans sa grosse caisse." : (pct >= 0.45 ? "Le conseil te reconduit, avec quelques sourcils levés." : "Le conseil te reconduit de justesse, sous haute surveillance."));
    var sign = bonus >= 0 ? "+" : "−";
    $main.innerHTML = '<section class="card"><span class="tag">' + (last ? "Dernier bilan" : "Conseil d'administration") + "</span><h2>Bilan de l'édition " + (ei + 1) + "</h2>" +
      '<p class="lead">' + esc(ed.title) + "</p>" +
      '<div class="chips"><span class="chip">Trésorerie ' + Math.round(S.cash) + '</span><span class="chip">Ambiance ' + Math.round(S.mood) + '</span><span class="chip">Conformité ' + Math.round(S.law) + "</span></div>" +
      '<p class="lead">Bonus ou malus de gestion selon l\'état moyen de tes jauges : <b>' + sign + Math.abs(bonus) + " points</b>. Score actuel : <b>" + Math.round(S.score) + "</b>.</p>" +
      '<div class="fb ' + (fired ? "ko" : "ok") + '"><h3>' + (fired ? "Remercié" : "Reconduit") + "</h3><p>" + esc(msg) + "</p></div>" +
      '<button class="btn" id="go">' + (fired ? "Voir la fin" : (last ? "Voir le verdict final" : "Édition suivante")) + "</button></section>";
    bindGo();
  }

  /* ---------- Fin de partie ---------- */
  function outcome() {
    if (S.over) return { win: false, title: D.ENDS[S.over].title, text: D.ENDS[S.over].text, type: S.over };
    var pct = maxSeen() ? S.score / maxSeen() : 0, t = D.TIERS.filter(function (x) { return pct >= x.min; })[0];
    return { win: true, title: t.title, text: t.text, type: "win" };
  }
  function renderEnd() {
    var out = outcome(), mast = "";
    [1, 2, 3].forEach(function (c) {
      if (!S.mx[c]) return;
      var p = Math.round(100 * S.earn[c] / S.mx[c]);
      mast += '<div class="mast ' + (p < 50 ? "low" : "") + '"><span>' + CHAPS[c] + '</span><span class="bar"><i style="width:' + p + '%"></i></span><span>' + p + " %</span></div>";
    });
    var seen = {}, rev = "";
    S.misses.forEach(function (m) {
      if (!m.rule || seen[m.rule.ref] || Object.keys(seen).length >= 6) return;
      seen[m.rule.ref] = 1;
      rev += '<div class="miss"><b>' + esc(m.rule.ref) + "</b>" + esc(m.rule.text) + "</div>";
    });
    $main.innerHTML = '<section class="card"><span class="tag">' + (out.win ? "Verdict final" : "Fin de partie") + "</span>" +
      '<h2 class="endtitle">' + esc(out.title) + '</h2><p class="lead">' + esc(out.text) + "</p>" +
      '<p class="bigscore">' + Math.round(S.score) + '<small style="font-size:18px"> pts</small></p>' +
      '<div class="chips"><span class="chip">Trésorerie ' + Math.round(S.cash) + '</span><span class="chip">Ambiance ' + Math.round(S.mood) + '</span><span class="chip">Conformité ' + Math.round(S.law) + "</span></div>" +
      '<div class="row"><button class="btn" id="again">Rejouer</button></div></section>' +
      '<section class="card"><h3 class="sec">Ta maîtrise par chapitre</h3>' + (mast || '<p class="hint" style="margin:0">Pas assez de décisions pour établir un bilan.</p>') + "</section>" +
      (rev ? '<section class="card"><h3 class="sec">À revoir en cours</h3><div class="review">' + rev + "</div></section>" : "") +
      '<section class="card"><h3 class="sec">Classement</h3><div id="board"><p class="hint" style="margin:0">Enregistrement du score…</p></div></section>' +
      '<section class="card"><h3 class="sec">Notions les plus ratées</h3><div id="tags"><p class="hint" style="margin:0">Chargement…</p></div></section>';
    document.getElementById("again").onclick = function () { if (boardUnsub) { boardUnsub(); boardUnsub = null; } S = null; render(); };
    var tags = []; S.misses.forEach(function (m) { if (tags.indexOf(m.tag) < 0 && tags.length < 8) tags.push(m.tag); });
    var pc = function (c) { return S.mx[c] ? Math.round(100 * S.earn[c] / S.mx[c]) : null; };
    var details = { cls: S.cls, ending: out.title, type: out.type, ed: S.reach + 1, cash: Math.round(S.cash), mood: Math.round(S.mood), law: Math.round(S.law), ch1: pc(1), ch2: pc(2), ch3: pc(3), tags: tags, secs: Math.round((Date.now() - S.t0) / 1000) };
    saveAndShowBoard({ name: S.name, cls: S.cls, score: Math.round(S.score), details: details });
  }

  /* ---------- Classement ---------- */
  var boardRows = [], boardMe = "", boardState = "none", boardClass = "";
  function renderBoardOnly() {
    renderHeader();
    $main.innerHTML = '<section class="card"><h3 class="sec">Classement</h3><div id="board"><p class="hint" style="margin:0">Chargement du classement…</p></div></section>' +
      '<section class="card"><h3 class="sec">Notions les plus ratées</h3><div id="tags"><p class="hint" style="margin:0">Chargement…</p></div></section>' +
      '<div class="row"><button class="btn ghost" id="back">Retour</button></div>';
    document.getElementById("back").onclick = function () { if (boardUnsub) { boardUnsub(); boardUnsub = null; } render(); };
    saveAndShowBoard(null);
  }
  function saveAndShowBoard(row) {
    var boardEl = function () { return document.getElementById("board"); }, tagsEl = function () { return document.getElementById("tags"); };
    var unavailable = function (msg) {
      if (boardEl()) boardEl().innerHTML = '<p class="hint" style="margin:0">' + esc(msg) + "</p>";
      if (tagsEl()) tagsEl().innerHTML = '<p class="hint" style="margin:0">Disponible avec le classement.</p>';
    };
    if (!(window.MesJeux && MesJeux.ready())) { unavailable("Le classement n'est pas encore branché."); return; }
    if (boardUnsub) { boardUnsub(); boardUnsub = null; }
    boardClass = row ? (row.cls || "") : lsGet("df_cls");
    boardMe = row ? row.name : lsGet("df_name");
    function toRow(r) { var d = r.details || {}; return { name: r.player, cls: d.cls || "", score: r.score, ending: d.ending || "", tags: d.tags || [], ts: Date.parse(r.created_at) || 0 }; }
    function refresh() {
      return MesJeux.list(GAME_ID, 1000).then(function (rows) { boardRows = rows.map(toRow); redraw(); }, function () { unavailable("Le classement n'a pas pu être lu."); });
    }
    var saveP = Promise.resolve("none");
    if (row && !S.saved) { S.saved = true; saveP = MesJeux.save(GAME_ID, row.name, row.score, row.details).then(function (r) { return r.ok ? "saved" : "readonly"; }); }
    saveP.then(function (state) {
      boardState = state;
      refresh().then(function () {
        var id = setInterval(function () { if (!boardEl()) { clearInterval(id); return; } refresh(); }, 30000);
        boardUnsub = function () { clearInterval(id); };
      });
    });
  }
  function redraw() {
    var rows = boardClass ? boardRows.filter(function (r) { return r.cls === boardClass; }) : boardRows;
    drawBoard(rows); drawTags(rows);
  }
  function classPicker() {
    var o = '<option value="">Toutes les classes</option>' + CLASSES.map(function (c) { return '<option' + (c === boardClass ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
    return '<div class="field" style="max-width:260px;margin:0 0 12px"><label for="bc">Classement de la classe</label><select id="bc">' + o + "</select></div>";
  }
  function bindPicker() { var p = document.getElementById("bc"); if (p) p.onchange = function () { boardClass = this.value; redraw(); }; }
  function ordinal(n) { return n === 1 ? "1ᵉʳ" : n + "ᵉ"; }
  /* Phrase de fin de partie : place dans le classement affiché et écart avec la place au-dessus */
  function placeNote(rows, meTs) {
    if (boardState !== "saved") return "";
    var i = -1;
    rows.forEach(function (r, k) { if (r.name === boardMe && r.ts === meTs) i = k; });
    if (i < 0) return "";
    var t = "<b>Ton score : " + esc(Math.round(rows[i].score)) + " points.</b> Tu es " + ordinal(i + 1) + " sur " + rows.length + " partie" + (rows.length > 1 ? "s" : "") + (boardClass ? " en " + esc(boardClass) : "") + ".";
    if (i === 0) t += " Tu es en tête du classement !";
    else {
      var d = Math.round(rows[i - 1].score) - Math.round(rows[i].score);
      t += d > 0 ? " " + esc(rows[i - 1].name) + " est devant toi de " + d + " point" + (d > 1 ? "s" : "") + "." : " Égalité de points avec " + esc(rows[i - 1].name) + ", qui a terminé avant toi.";
    }
    return '<p class="place">' + t + "</p>";
  }
  function drawBoard(rows) {
    var el = document.getElementById("board"); if (!el) return;
    rows = rows.slice().sort(function (a, b) { return (b.score - a.score) || (a.ts - b.ts); });
    var note = boardState === "readonly" ? '<p class="hint" style="margin:0 0 10px">Ton résultat n\'a pas pu être enregistré (connexion indisponible). Il sera renvoyé à la prochaine ouverture du jeu.</p>' : "";
    if (!rows.length) { el.innerHTML = classPicker() + note + '<p class="hint" style="margin:0">Aucun résultat pour l\'instant. Le premier à finir ouvre le classement.</p>'; bindPicker(); return; }
    var meTs = Math.max.apply(null, rows.filter(function (r) { return r.name === boardMe; }).map(function (r) { return r.ts; }).concat([0]));
    var h = classPicker() + note + placeNote(rows, meTs) + '<div class="tbl"><table class="board"><thead><tr><th class="rk">#</th><th>Joueur</th><th>Fin</th><th class="num">Score</th></tr></thead><tbody>';
    rows.slice(0, 30).forEach(function (r, i) {
      h += '<tr class="' + (r.name === boardMe && r.ts === meTs ? "me" : "") + '"><td class="rk">' + (i + 1) + '</td><td>' + esc(r.name || "?") + (r.cls ? ' <span class="cls">' + esc(r.cls) + "</span>" : "") + "</td><td>" + esc(r.ending) + '</td><td class="num"><b>' + esc(Math.round(r.score)) + "</b></td></tr>";
    });
    h += "</tbody></table></div><p class=\"hint\" style=\"margin:10px 0 0\">" + rows.length + " partie" + (rows.length > 1 ? "s" : "") + ". Chaque partie jouée est ajoutée au classement.</p>";
    el.innerHTML = h; bindPicker();
  }
  function drawTags(rows) {
    var el = document.getElementById("tags"); if (!el) return;
    var count = {};
    rows.forEach(function (r) { (r.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; }); });
    var arr = Object.keys(count).map(function (k) { return [k, count[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
    if (!arr.length) { el.innerHTML = '<p class="hint" style="margin:0">Pas encore assez de résultats.</p>'; return; }
    var max = arr[0][1], h = "";
    arr.forEach(function (a) { h += '<div class="tag-row"><span>' + esc(a[0]) + '</span><span class="tag-bar" title="' + a[1] + ' erreurs"><i style="width:' + Math.round(100 * a[1] / max) + '%"></i></span></div>'; });
    el.innerHTML = h + '<p class="hint" style="margin:8px 0 0">Calculé sur toutes les parties de la classe sélectionnée.</p>';
  }

  /* Raccourci pour essayer un mini-jeu : jeux/drh-festival.html?mini=pong (ou stop, simon). Rien n'est enregistré. */
  (function () {
    var m = (location.search.match(/[?&]mini=(pong|stop|simon)/) || [])[1];
    if (!m) return;
    newGame("Essai M.", ""); S.demo = true;
    var i = steps.findIndex(function (s) { return s.k === "scene" && s.sc.ty === "bet" && s.sc.g === m; });
    S.i = i;
  })();
  render();
})();
</script>
</body>
