<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La salle de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="page">
  <h1>La salle de jeux</h1>
  <p class="lead">Choisis ta rubrique, entre ton prénom, joue. Ton score est enregistré tout seul à la fin de la partie.</p>
  <div class="tally" id="tally" aria-live="polite"></div>
  <div id="games"></div>
  <p class="note"><a href="classement.html">Voir les classements</a></p>
</main>

<script src="js/qrcode.js"></script>
<script src="js/codes.js"></script>
<script src="js/config.js"></script>
<script src="js/games.js"></script>
<script src="js/scores.js"></script>
<script src="js/endings.js"></script>
<script src="js/access.js"></script>
<script>
(function () {
  "use strict";
  var esc = MesJeux.esc, root = document.getElementById("games");
  var total = 0, pending = 0;

  function podium(g, html) { var o = document.getElementById("top-" + g.id); if (o) o.innerHTML = html; }

  /* Traits de pointage : quatre barres et une barre en travers, par groupe de cinq */
  function tallyHTML(n) {
    var shown = Math.min(n, 50), groups = Math.floor(shown / 5), rest = shown % 5, h = "";
    function svg(bars, crossed) {
      var w = Math.max(bars, 1) * 10 + 6, s = '<svg viewBox="0 0 ' + w + ' 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">';
      for (var i = 0; i < bars; i++) s += '<path d="M' + (5 + i * 10) + ' 3v34"/>';
      if (crossed) s += '<path d="M1 33L' + (w - 1) + ' 7"/>';
      return s + "</svg>";
    }
    for (var i = 0; i < groups; i++) h += svg(4, true);
    if (rest) h += svg(rest, false);
    return h + '<span class="count">' + n + " partie" + (n > 1 ? "s" : "") + " jouée" + (n > 1 ? "s" : "") + (n > 50 ? " (50 traits affichés)" : "") + "</span>";
  }

  /* Un jeu = son nom ; un clic déroule la description, le podium et le bouton Jouer */
  function gameBlock(g) {
    var d = document.createElement("details");
    d.className = "game";
    d.innerHTML =
      '<summary class="tag" style="--bg:' + g.bg + ';--fg:' + g.fg + '">' + esc(g.title) + '</summary>' +
      '<div class="game-body">' +
      '<p class="blurb">' + esc(g.blurb) + (g.codeHash ? ' <span class="small">Ce jeu demande un code.</span>' : "") + '</p>' +
      '<ol class="podium" id="top-' + esc(g.id) + '"><li><span class="empty">Chargement des scores…</span></li></ol>' +
      '<div class="row"><a class="btn" href="' + esc(g.file) + '">Jouer</a>' +
      '<a href="classement.html?game=' + encodeURIComponent(g.id) + '">Classement complet</a></div>' +
      qrBlock(g) + '</div>';
    return d;
  }

  /* QR code du jeu : il ouvre directement la page du jeu (adresse complète, calculée depuis celle du site) */
  function qrBlock(g) {
    if (typeof qrcode !== "function") return "";
    try {
      var url = new URL(g.file, location.href).href;
      var qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      var svg = qr.createSvgTag({ cellSize: 4, margin: 16, scalable: true, alt: "QR code pour ouvrir " + g.title });
      return '<figure class="qr">' + svg + '<figcaption>Scanne pour jouer<span class="small"> · ' + esc(g.title) + '</span></figcaption></figure>';
    } catch (e) { return ""; }
  }

  /* Page « Les codes » (rubrique Perso) : menu déroulant fermé par un code à 6 chiffres.
     La liste est chiffrée dans js/codes.js ; elle n'est déchiffrée que dans la mémoire de la page,
     le code saisi n'est jamais enregistré (il faut le retaper à chaque visite). */
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function decryptCodes(pass) {
    var C = window.MESJEUX_CODES;
    if (!C || !(window.crypto && crypto.subtle)) return Promise.reject(new Error("indisponible"));
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(C.salt), iterations: C.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(C.iv) }, key, b64(C.data));
    }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function codesBlock() {
    var d = document.createElement("details");
    d.className = "game";
    d.innerHTML =
      '<summary class="tag" style="--bg:#7a1f1f;--fg:#ffffff">Les codes</summary>' +
      '<div class="game-body"><div class="codes-lock">' +
      '<p class="blurb">Cette page est protégée. Entre le code à 6 chiffres.</p>' +
      '<form class="codeform"><input inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Code de la page des codes">' +
      '<button class="btn" type="submit">Voir les codes</button></form><p class="err" role="alert"></p></div>' +
      '<div class="codes-list" hidden></div></div>';
    var form = d.querySelector("form"), input = d.querySelector("input"), err = d.querySelector(".err");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!/^\d{6}$/.test(input.value)) { err.textContent = "Le code fait 6 chiffres."; return; }
      err.textContent = "Vérification…";
      decryptCodes(input.value).then(function (data) {
        var list = d.querySelector(".codes-list");
        list.innerHTML = '<p class="blurb">Les codes d’accès des jeux. Les majuscules n’ont pas d’importance.</p><dl class="codes">' +
          data.items.map(function (it) { return "<dt>" + esc(it.t) + "</dt><dd>" + esc(it.c) + "</dd>"; }).join("") + "</dl>" +
          '<button class="btn ghost" type="button">Masquer</button>';
        list.querySelector("button").addEventListener("click", function () {
          list.hidden = true; list.innerHTML = ""; input.value = ""; err.textContent = "";
          d.querySelector(".codes-lock").hidden = false;
        });
        d.querySelector(".codes-lock").hidden = true; list.hidden = false;
        input.value = "";
      }, function () {
        err.textContent = "Code incorrect. Réessaie."; input.select();
      });
    });
    return d;
  }

  function lockBlock(s) {
    var box = document.createElement("div");
    box.className = "lock";
    box.innerHTML = '<p>Cette rubrique est réservée. Entre le code à ' + s.digits + ' chiffres.</p>' +
      '<form class="codeform"><input inputmode="numeric" pattern="[0-9]*" maxlength="' + s.digits + '" autocomplete="off" aria-label="Code de la rubrique ' + esc(s.title) + '">' +
      '<button class="btn" type="submit">Entrer</button></form><p class="err" role="alert"></p>';
    var input = box.querySelector("input"), err = box.querySelector(".err");
    box.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      Access.tryCode("sec", s, input.value).then(function (ok) {
        if (ok) render(); else { err.textContent = "Code incorrect. Réessaie."; input.select(); }
      });
    });
    return box;
  }

  function loadScores(g) {
    pending++;
    MesJeux.list(g.id, 1000).then(function (rows) {
      total += rows.length;
      var top = g.rank === "endings" ? Endings.rank(rows).slice(0, 3).map(function (o) { return { player: o.player, score: o.count }; }) : rows.slice(0, 3);
      if (!top.length) { podium(g, '<li><span class="empty">Aucune partie pour l’instant. Lance la première.</span></li>'); return; }
      podium(g, top.map(function (r, i) {
        return '<li><span class="rk">' + (i + 1) + '</span><span class="nm"><span>' + esc(r.player) + '</span></span><span class="sc">' + esc(Math.round(r.score)) + esc(g.unit || "") + "</span></li>";
      }).join(""));
    }, function () {
      podium(g, '<li><span class="empty">Classement indisponible pour le moment.</span></li>');
    }).then(function () {
      if (--pending === 0 && total > 0) document.getElementById("tally").innerHTML = tallyHTML(total);
    });
  }

  function render() {
    root.innerHTML = ""; total = 0; pending = 0;
    document.getElementById("tally").innerHTML = "";
    var toLoad = [];
    Access.sections.forEach(function (s) {
      var wrap = document.createElement("section");
      wrap.className = "rubrique";
      wrap.innerHTML = '<h2 class="rubrique-title">' + esc(s.title) + "</h2>";
      root.appendChild(wrap);
      if (!Access.sectionOpen(s)) { wrap.appendChild(lockBlock(s)); return; }
      var list = Access.games.filter(function (g) { return g.section === s.id; });
      if (!list.length) { var p = document.createElement("p"); p.className = "soon"; p.textContent = "Bientôt des jeux ici."; wrap.appendChild(p); return; }
      list.forEach(function (g) { wrap.appendChild(gameBlock(g)); toLoad.push(g); });
      if (s.id === "perso" && window.MESJEUX_CODES) wrap.appendChild(codesBlock());
    });
    if (!MesJeux.ready()) {
      toLoad.forEach(function (g) { podium(g, '<li><span class="empty">Les classements ne sont pas encore branchés.</span></li>'); });
      return;
    }
    toLoad.forEach(loadScores);
  }
  render();
})();
</script>
</body>
</html>
